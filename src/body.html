<div id="app">
  <canvas id="cv"></canvas>

  <div id="loading">
    <div class="boot">
      <p>ТЕРМИНАЛ СМОТРИТЕЛЯ · МОДЕЛЬ 2077</p>
      <p>ПРОВЕРКА ГЕРМЕТИЧНОСТИ…… <b>НОРМА</b></p>
      <p>РЕАКТОР…………………… <b>НОРМА</b></p>
      <p>ЗАГРУЗКА УБЕЖИЩА<span class="caret">_</span></p>
    </div>
  </div>

  <section id="menu" hidden>
    <div class="menu-wrap">
      <div class="logo">
        <div class="logo-gear" data-ic="door"></div>
        <small>Подземная система выживания</small>
        <h1><span class="l1">Атомное</span><span class="l2">Убежище</span></h1>
        <p>Постройте убежище. Спасите выживших. Переживите Пустошь.</p>
      </div>
      <div class="term menu-term">
        <div class="term-scr">
          <div class="term-title">ТЕРМИНАЛ СМОТРИТЕЛЯ</div>
          <button class="mbtn pri" id="m-continue" data-a="continue" hidden><span>Продолжить</span><small></small></button>
          <button class="mbtn" data-a="newgame"><span>Новое убежище</span></button>
          <button class="mbtn" data-a="help"><span>Как играть</span></button>
          <button class="mbtn" id="m-sound" data-a="sound"><span>Звук</span></button>
        </div>
      </div>
    </div>
  </section>

  <div id="game-ui" hidden>
    <div id="top">
      <header id="hud"></header>
      <div id="place" hidden><span class="pl-ic" data-ic="build"></span><div><b></b><small></small></div><button class="t-btn small" data-a="cancelPlace">Отмена</button></div>
      <div id="toasts"></div>
    </div>
    <div id="rail"></div>
    <div id="tut" hidden><span class="tut-ava" data-ic="smile"></span><p></p><button class="link" data-a="tutSkip">Пропустить</button></div>
    <section id="sheet" hidden>
      <div class="term">
        <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
        <div class="term-scr">
          <div class="term-head">
            <button id="sheet-back" class="t-icon" data-a="back" aria-label="Назад" data-ic="back"></button>
            <h2 id="sheet-t"></h2>
            <button class="t-icon" data-a="close" aria-label="Закрыть" data-ic="x"></button>
          </div>
          <div id="sheet-b"></div>
        </div>
      </div>
    </section>
    <nav id="bar">
      <button data-a="dwellers"><i data-ic="people"></i><span>Жители</span></button>
      <button data-a="inventory"><i data-ic="bag"></i><span>Склад</span></button>
      <button data-a="build" class="dock-main"><i data-ic="build"></i><span>Строить</span></button>
      <button data-a="waste"><i data-ic="map"></i><span>Пустошь</span></button>
      <button data-a="menu"><i data-ic="menu"></i><span>Пип-бой</span></button>
    </nav>
  </div>

  <div id="modal" hidden></div>
</div>
