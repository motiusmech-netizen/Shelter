:root {
  color-scheme: dark;
  --bg: #0e1316;
  --panel: #161e24;
  --panel2: #1e2930;
  --panel3: #26343c;
  --line: #33444e;
  --ink: #efe6cf;
  --muted: #93a2a7;
  --acc: #f0b429;
  --acc-ink: #1d1606;
  --blue: #2f6db3;
  --good: #7ed957;
  --bad: #ef5b42;
  --q: #3fe0d0;
  --fd: "Russo One", "Arial Black", Impact, sans-serif;
  --fb: "PT Sans Narrow", "Roboto Condensed", "Arial Narrow", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body { font: 16px/1.35 var(--fb); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; fill: currentColor; flex: none; vertical-align: -0.2em; }
.mono { font-variant-numeric: tabular-nums; font-family: var(--fb); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.good-t { color: var(--good); } .bad-t { color: var(--bad) !important; } .warn-t { color: var(--acc); } .danger-t { color: var(--bad); }

#app { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* загрузка */
#loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); z-index: 50; color: var(--muted); }
#loading .spin .ic { width: 56px; height: 56px; color: var(--acc); animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 14px; border-radius: 9px; background: var(--panel3); border: 1px solid var(--line); font-weight: 700; font-size: 16px; line-height: 1.1; text-align: left; transition: transform .08s, filter .15s; }
.btn:active:not([disabled]) { transform: translateY(1px) scale(.98); }
.btn span { display: flex; flex-direction: column; }
.btn small { font-weight: 400; font-size: 13px; opacity: .8; }
.btn.primary { background: var(--acc); color: var(--acc-ink); border-color: #ffd46a; box-shadow: 0 2px 0 #9a6c0c; }
.btn.q { background: #10383a; border-color: #1f6b66; color: var(--q); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: #ff8a70; color: #1a0703; }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn.big { min-height: 54px; font-size: 19px; }
.btn.wide { width: 100%; margin-block: 10px; }
.btn.static { cursor: default; opacity: .6; }
.btn[disabled] { opacity: .42; cursor: default; box-shadow: none; }
.btn.rush .ic { color: var(--q); } .btn.up .ic { color: var(--good); }
.btn.primary .ic, .btn.primary.up .ic { color: var(--acc-ink); }
.link { color: var(--acc); text-decoration: underline; font-size: 14px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
.btn-row .btn { flex: 1 1 auto; justify-content: center; text-align: center; }

/* главное меню */
#menu { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: calc(var(--safe-t) + 12vh) 16px calc(var(--safe-b) + 16px); overflow-y: auto; }
.menu-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 22px; }
.logo { text-align: center; }
.logo small { display: block; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--acc); }
.logo h1 { margin: 8px 0 6px; font: 44px/0.95 var(--fd); text-transform: uppercase; color: var(--ink); text-shadow: 0 3px 0 #000, 0 0 28px rgba(240,180,41,.25); text-wrap: balance; }
.logo h1 span { display: block; color: var(--acc); font-size: 1.12em; letter-spacing: .02em; }
.logo p { margin: 0; color: #d8cdb2; text-shadow: 0 1px 2px #000; }
.menu-btns { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: rgba(14,19,22,.82); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(4px); }
.menu-btns .btn { justify-content: center; text-align: center; }
.menu-btns .btn span { align-items: center; }

/* HUD */
#top { position: absolute; top: 0; left: 0; right: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: stretch; }
#top > * { pointer-events: auto; }
#hud { padding: calc(var(--safe-t) + 6px) 10px 7px; background: linear-gradient(#1c262d, #131a1f); border-bottom: 2px solid #07090b; box-shadow: 0 1px 0 rgba(240,180,41,.35), 0 6px 18px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 6px; }
.hud-top { display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 7px; background: rgba(0,0,0,.3); font: 15px var(--fd); white-space: nowrap; }
.chip .ic { width: 17px; height: 17px; color: var(--acc); }
.chip.caps .ic { color: #e2c779; } .chip.q .ic { color: var(--q); }
.chip b { font-weight: 400; font-variant-numeric: tabular-nums; }
.vault-plate { margin-inline: auto; white-space: nowrap; padding: 2px 12px; border-radius: 6px; background: var(--acc); color: var(--acc-ink); font: 15px var(--fd); letter-spacing: .08em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.vault-plate::before { content: "№ "; opacity: .6; }
.hud-res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.res { display: flex; align-items: center; gap: 5px; min-width: 0; }
.res .ic { width: 18px; height: 18px; color: var(--c); }
.res .meter { flex: 1; height: 9px; border-radius: 5px; background: rgba(0,0,0,.45); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); min-width: 20px; }
.res .meter i { display: block; height: 100%; background: var(--c); transition: width .3s; }
.res b { font: 13px var(--fd); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.res.low .meter { animation: blink 1s infinite; }
.res.low b { color: var(--bad); }
@keyframes blink { 50% { box-shadow: inset 0 0 0 1px var(--bad), 0 0 8px var(--bad); } }

#alerts { display: flex; gap: 6px; padding: 7px 10px 0; overflow-x: auto; scrollbar-width: none; pointer-events: none; }
#alerts::-webkit-scrollbar { display: none; }
.al { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; font-weight: 700; font-size: 14px; white-space: nowrap; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 3px 10px rgba(0,0,0,.4); }
.al.bad { background: #5a1a14; border-color: var(--bad); animation: pulse 1s infinite; }
.al.warn { background: #4a3a10; border-color: var(--acc); }
.al.good { background: #1f3a18; border-color: #4f8a3a; }
.al.lunch { background: #3a2a10; border-color: #b8862a; }
.pulse { animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); filter: brightness(1.25); } }

#place { margin: 8px auto 0; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 10px; background: #3a2c0c; border: 1px solid var(--acc); box-shadow: 0 6px 18px rgba(0,0,0,.5); max-width: calc(100% - 20px); }
#place b { display: block; font: 15px var(--fd); color: var(--acc); }
#place small { color: #e8d9b4; font-size: 13px; }

#toasts { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 12px 0; pointer-events: none; }
.toast { max-width: min(460px, 100%); padding: 6px 12px; border-radius: 9px; background: rgba(16,22,26,.93); border: 1px solid var(--line); font-size: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.45); animation: tin .25s ease-out; transition: opacity .4s, transform .4s; display: flex; gap: 8px; align-items: baseline; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-1px); }
.toast.good::before { background: var(--good); } .toast.bad::before { background: var(--bad); } .toast.warn::before { background: var(--acc); }
.toast.bad { border-color: #7a2a20; }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } }

/* обучение */
#tut { position: absolute; left: 10px; right: 10px; bottom: calc(var(--safe-b) + 74px); z-index: 9; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(28,24,12,.94); border: 1px solid var(--acc); box-shadow: 0 8px 22px rgba(0,0,0,.5); max-width: 560px; margin-inline: auto; }
#tut p { margin: 0; flex: 1; font-size: 15px; }
.tut-ic .ic { width: 28px; height: 28px; color: var(--acc); }

/* нижняя панель */
#bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; padding: 6px 4px calc(var(--safe-b) + 6px); background: linear-gradient(#182026, #0f1418); border-top: 2px solid #07090b; box-shadow: 0 -1px 0 rgba(240,180,41,.35); }
#bar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12.5px; font-weight: 700; color: #cdd6d8; position: relative; border-radius: 8px; min-width: 0; }
#bar button .ic { width: 25px; height: 25px; color: var(--acc); }
#bar button:active { background: rgba(255,255,255,.06); }
#bar button.pulse { background: rgba(240,180,41,.18); }
.badge { position: absolute; top: 0; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font: 11px/18px var(--fd); font-style: normal; text-align: center; padding: 0 4px; }

/* нижний лист */
#sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; max-height: 64%; display: flex; flex-direction: column; background: var(--panel); border-top: 3px solid var(--acc); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.55); animation: sheetin .22s ease-out; }
@keyframes sheetin { from { transform: translateY(30px); opacity: .4; } }
.sheet-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 12px; border-bottom: 1px solid #0a0e10; }
.sheet-h h2 { flex: 1; margin: 0; font: 17px var(--fd); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-wrap: balance; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--panel2); }
.icon-btn .ic { width: 22px; height: 22px; }
#sheet-b { overflow-y: auto; padding: 10px 14px calc(var(--safe-b) + 16px); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@media (min-width: 820px) {
  #sheet { left: auto; top: calc(var(--hud-h, 110px) + 8px); width: 420px; max-height: none; bottom: 8px; right: 12px; border-radius: 14px; border: 1px solid var(--line); border-top: 3px solid var(--acc); }
  #tut { left: 12px; right: auto; width: 420px; }
}

h3.sub { margin: 16px 0 8px; font: 14px var(--fd); text-transform: uppercase; letter-spacing: .06em; color: var(--acc); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h3.sub small { font: 13px var(--fb); text-transform: none; letter-spacing: 0; }
.empty-t { text-align: center; color: var(--muted); padding: 18px 8px; }
.row-sp { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.grow b { overflow: hidden; text-overflow: ellipsis; }
.grow small { color: var(--muted); font-size: 13.5px; }

/* комната */
.room-head { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--rc) 55%, #10161a), #10161a 80%); border: 1px solid rgba(255,255,255,.07); }
.room-head > div:first-child { flex: 1; }
.room-head p { margin: 4px 0 0; font-size: 14.5px; }
.lvl { font: 13px var(--fd); color: var(--acc); letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stat-need { display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.35); }
.stat-need em { font: 20px var(--fd); color: var(--acc); font-style: normal; }
.stat-need small { font-size: 12px; color: var(--muted); }
.status { margin-top: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--panel2); flex-wrap: wrap; }
.status.col { flex-direction: column; align-items: stretch; gap: 6px; }
.status > span { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.status .ic { color: #ef5470; }
.banner { margin-top: 10px; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; font-size: 14.5px; }
.banner.bad { background: #4a1612; border: 1px solid var(--bad); }
.banner.warn { background: #3a2e0e; border: 1px solid #8a6a1a; }
.banner .ic { width: 22px; height: 22px; }
.ri { display: inline-grid; place-items: center; color: var(--c); }
.ri .ic { width: 20px; height: 20px; }
.pbar { display: block; height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--acc); border-radius: 4px; transition: width .4s; }
.hpbar { position: relative; display: block; height: 6px; border-radius: 3px; background: #2c1714; overflow: hidden; margin-top: 3px; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
.hpbar u { position: absolute; right: 0; top: 0; bottom: 0; background: #c0392b; text-decoration: none; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); min-height: 116px; text-align: center; }
.slot .hpbar { width: 70%; }
.slot .nm { font-weight: 700; font-size: 14.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .pbar { width: 80%; }
.slot.empty { border-style: dashed; color: var(--muted); justify-content: center; }
.slot .plus { font: 30px/1 var(--fd); color: var(--acc); }
.up .ic, b.up .ic { color: var(--good); }
.big-stat { display: flex; flex-direction: column; align-items: center; font: 20px/1 var(--fd); color: var(--acc); min-width: 44px; }
.big-stat em { font: 700 11px var(--fb); color: var(--muted); font-style: normal; letter-spacing: .05em; margin-bottom: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions .btn { flex: 1 1 130px; }
.actions.col { flex-direction: column; }
.actions.col .btn { flex: none; justify-content: center; }

/* аватар */
.av { position: relative; width: 38px; height: 38px; border-radius: 50%; background: #0b1013; overflow: hidden; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.av i { position: absolute; left: 50%; top: 6px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--skin); box-shadow: 0 -3px 0 0 var(--hair); }
.av em { position: absolute; left: 50%; bottom: -8px; width: 26px; height: 20px; margin-left: -13px; border-radius: 50% 50% 0 0; background: var(--suit); }
.av.kid i { width: 12px; height: 12px; margin-left: -6px; top: 10px; }
.av.kid em { width: 20px; height: 15px; margin-left: -10px; }

/* списки */
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; background: var(--panel2); border: 1px solid transparent; text-align: left; width: 100%; }
button.row:active { background: var(--panel3); }
.row.sel { border-color: var(--acc); background: #2e2a18; }
.row.dead { opacity: .7; }
.row[disabled] { opacity: .45; }
.row > .ic { width: 26px; height: 26px; color: var(--muted); }
.ic.r0 { color: #c9c4b4; } .ic.r1 { color: #5aa9f0; } .ic.r2 { color: var(--acc); }
.swatch { width: 30px; height: 30px; border-radius: 8px; background: var(--rc); flex: none; }
.seg { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { padding: 6px 11px; border-radius: 8px; background: var(--panel2); font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--muted); }
.seg button.on { background: var(--acc); color: var(--acc-ink); }
.seg.small button { padding: 4px 8px; font-size: 13px; }

/* житель */
.dw-head { display: flex; gap: 12px; align-items: stretch; }
.portrait { width: 104px; height: 128px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #33424b, #141b20 70%); }
.dw-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.kv { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.kv > span:first-child { color: var(--muted); }
.kv .hpbar { margin: 0; height: 7px; }
.spg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
.sp { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 0 5px; border-radius: 9px; background: var(--panel2); }
.sp em { font: 700 11px var(--fb); color: var(--muted); font-style: normal; letter-spacing: .03em; }
.sp b { font: 20px/1.1 var(--fd); font-weight: 400; }
.sp i { position: absolute; top: 2px; right: 3px; font: 700 11px var(--fb); color: var(--good); font-style: normal; }
.sp.hl { background: #3a2e10; box-shadow: inset 0 0 0 1px var(--acc); }
.equip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.eq { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--line); text-align: left; min-width: 0; }
.eq > .ic { width: 26px; height: 26px; color: var(--acc); }
.eq span { display: flex; flex-direction: column; min-width: 0; }
.eq b { font-size: 15px; line-height: 1.15; }
.eq small { color: var(--muted); font-size: 12.5px; }
.rename { display: flex; flex-direction: column; gap: 6px; }
.rename label, #modal label { font-size: 14px; color: var(--muted); }
input { font: 700 18px var(--fb); padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: #0b1013; color: var(--ink); width: 100%; }
.center-block { display: flex; flex-direction: column; align-items: center; text-align: center; }
.center-block h3 { margin: 6px 0 2px; font: 18px var(--fd); }
.ic.huge { width: 64px; height: 64px; color: #8a8a86; }

/* строительство */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 8px; }
.bcard { display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 8px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); text-align: left; }
.bc-art { height: 54px; border-radius: 8px; background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 85%, #fff 8%), var(--rc)); display: grid; place-items: center; box-shadow: inset 0 -8px 0 rgba(0,0,0,.25); }
.bc-art em { font: 18px var(--fd); color: #fff5d8; font-style: normal; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.bc-art .ic { width: 26px; height: 26px; color: #fff5d8; }
.bcard b { font-size: 14.5px; line-height: 1.1; min-height: 2.2em; }
.bcard small { font: 13px var(--fd); color: #e2c779; display: flex; gap: 4px; align-items: center; }
.bcard small .ic { width: 14px; height: 14px; }
.bcard.locked { opacity: .5; }
.bcard.locked small { color: var(--muted); font-family: var(--fb); font-weight: 700; }
.bcard[disabled] { cursor: default; }
.cap-t { display: inline-flex; gap: 3px; align-items: center; }

/* склад */
.junk { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.jk { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); font-size: 14px; }
.jk b { flex: 1; } .jk em { font: 14px var(--fd); font-style: normal; color: var(--acc); }
.jk.r1 .ic { color: #5aa9f0; } .jk.r2 .ic { color: var(--acc); } .jk .ic { color: var(--muted); }
.rar { font: 700 11px var(--fb); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; }
.rar.r1 { background: #173a5a; color: #8cc8ff; } .rar.r2 { background: #4a3708; color: var(--acc); }

/* Пустошь */
.excard { padding: 10px; border-radius: 12px; background: var(--panel2); display: flex; flex-direction: column; gap: 8px; }
.ex-stats { display: flex; gap: 12px; flex-wrap: wrap; font: 14px var(--fd); }
.ex-stats > span { display: inline-flex; gap: 4px; align-items: center; }
.ex-stats .ic { width: 16px; height: 16px; color: var(--muted); }
.ex-stats .ri .ic { width: 16px; height: 16px; }
.ex-log { text-align: left; font-size: 14px; color: #d8cdb2; font-style: italic; }
.ex-log u { color: var(--acc); font-style: normal; margin-left: 4px; }
.stepper { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-top: 8px; border-radius: 10px; background: var(--panel2); }
.stepper b { min-width: 28px; text-align: center; font-size: 18px; }
.log p { margin: 0 0 8px; font-size: 14.5px; display: flex; gap: 10px; }
.log p .mono { color: var(--acc); min-width: 44px; }
.quest, .recipe, .obj { padding: 10px 12px; border-radius: 12px; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; }
.quest p { margin: 0; }
.quest .btn { align-self: flex-start; }
.q-meta, .need { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: #d8cdb2; }
.q-meta span, .need span { display: inline-flex; gap: 3px; align-items: center; }
.q-meta .ic, .need .ic { width: 14px; height: 14px; }
.recipe.locked { opacity: .55; }
.obj.done { box-shadow: inset 0 0 0 1px #4f8a3a; }
.sticky { position: sticky; bottom: 0; }
.lunch-box { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: linear-gradient(120deg, #3a2a10, var(--panel2)); }
.lb-art { position: relative; flex: none; }
.lb-art .ic { width: 56px; height: 56px; color: var(--acc); }

}
function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;

}

  n = Math.abs(n) % 100;

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function weighted(list) { // [[item, weight], ...]
  let tot = 0;
  for (const x of list) tot += x[1];
  let r = rnd() * tot;
  for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; }
  return list[list.length - 1][0];
}

  if (/(ов|ев|ёв|ин|ын)$/.test(s)) return s + 'а';

function gearPath(cx, cy, ro, ri2, teeth, hole) {
  let p = '';
  const n = teeth * 2;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
    const r = i % 2 ? ri2 : ro;
    const x0 = cx + Math.cos(a0) * r, y0 = cy + Math.sin(a0) * r, x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
    p += (i ? 'L' : 'M') + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'L' + x1.toFixed(2) + ' ' + y1.toFixed(2);
  }
  p += 'Z';
  if (hole) p += `M${cx + hole} ${cy}A${hole} ${hole} 0 1 0 ${cx - hole} ${cy}A${hole} ${hole} 0 1 0 ${cx + hole} ${cy}Z`;
  return p;
}

const Snd = {
  ctx: null, on: true, master: null, paused: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !this.paused) this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  pause(p) {
    this.paused = p;
    if (!this.ctx) return;
    try { p ? this.ctx.suspend() : this.ctx.resume(); } catch (e) {}
  },
  tone(f, dur, type = 'square', vol = 0.08, slide = 0, delay = 0) {
    if (!this.on || !this.ctx || this.paused) return;
    try {
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },
  click() { this.tone(520, 0.05, 'square', 0.04); },
  collect() { this.tone(660, 0.07, 'triangle', 0.1); this.tone(990, 0.09, 'triangle', 0.08, 0, 0.06); },
  coin() { this.tone(1200, 0.05, 'square', 0.05); this.tone(1600, 0.08, 'square', 0.05, 0, 0.05); },
  build() { this.tone(140, 0.12, 'sawtooth', 0.08); this.tone(220, 0.1, 'square', 0.06, 0, 0.1); this.tone(330, 0.15, 'triangle', 0.08, 0, 0.2); },
  level() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.09, 0, i * 0.08)); },
  alarm() { for (let i = 0; i < 3; i++) this.tone(480, 0.35, 'sawtooth', 0.06, 380, i * 0.4); },
  bad() { this.tone(200, 0.2, 'square', 0.06, -80); },
  open() { this.tone(300, 0.08, 'triangle', 0.08, 300); },

  tick1: 0, saveT: 0, offline: false, playing: false, paused: false,
  place: null, sel: null, flash: 0, powerCheck: 0,
};
const SAVE_KEY = 'atom_shelter_save_v1';

function uid() { return ++S.nid; }
function D(id) { return R.dmap.get(id); }
function RM(id) { return R.rmap.get(id); }
function door() { return S.rooms[0]; }

function roomW(r) { return r.t === 'door' ? DOOR_W : r.t === 'elev' ? 1 : r.s * 3; }
function roomX(r) { return r.c * CW; }
function roomY(r) { return SURF + r.f * FH; }
function roomCap(r) {
  if (r.t === 'door') return 2;
  if (r.t === 'elev' || r.t === 'overseer') return 0;
  return r.s * 2;
}
function roomName(r) {
  if (r.t === 'door') return 'Дверь убежища';
  if (r.t === 'elev') return 'Лифт';
  return ROOMS[r.t].n;
}

function reindex() {
  R.dmap.clear();
  for (const d of S.dwellers) R.dmap.set(d.id, d);
  R.rmap.clear();
  for (const r of S.rooms) R.rmap.set(r.id, r);
  rebuildGrid();
}
function rebuildGrid() {
  R.grid = [];
  for (let f = 0; f < MAXF; f++) R.grid.push(new Array(GW).fill(null));
  for (const r of S.rooms) {
    const w = roomW(r);
    for (let i = 0; i < w; i++) if (R.grid[r.f]) R.grid[r.f][r.c + i] = r;
  }
}
function at(f, c) { return f >= 0 && f < MAXF && c >= 0 && c < GW ? R.grid[f][c] : null; }
function maxFloor() { let m = 0; for (const r of S.rooms) if (r.f > m) m = r.f; return m; }

// ===== Жители =====
function statBonus(d, i) { return d.outfit ? OUTFITS[d.outfit.id][1][i] : 0; }
function stat(d, i) { return d.sp[i] + statBonus(d, i); }
function bestStat(d) { let b = 0; for (let i = 1; i < 7; i++) if (stat(d, i) > stat(d, b)) b = i; return b; }
function xpNeed(l) { return Math.floor(40 + 30 * Math.pow(l, 1.4)); }
function effMax(d) { return Math.max(1, d.mhp - d.rad); }
function isAdult(d) { return !d.child; }
function fullName(d) { return d.name + ' ' + (d.g === 'f' ? femSurname(d.sur) : d.sur); }
function dmgAvg(d) { if (!d.weapon) return 1.2; const w = WEAPONS[d.weapon.id]; return (w[1] + w[2]) / 2; }
function dwellerDps(d) { return dmgAvg(d) * (0.9 + 0.02 * d.lvl) * (1 + stat(d, 0) * 0.015); }

function genDweller(o = {}) {
  const g = o.g || (rnd() < 0.5 ? 'm' : 'f');
  const rarity = o.rarity || 0;
  const sp = [1, 1, 1, 1, 1, 1, 1];
  let extra = rarity === 2 ? 30 : rarity === 1 ? ri(14, 20) : ri(4, 9);
  while (extra > 0) { const i = ri(0, 6); if (sp[i] < 10) { sp[i]++; extra--; } }
  const d = {
    id: uid(), name: pick(g === 'm' ? NAMES_M : NAMES_F), sur: pick(SURNAMES), g, rar: rarity,
    lvl: 1, xp: 0, sp, mhp: 105, hp: 105, rad: 0, hap: 60, lu: false,
    outfit: null, weapon: null, room: null, st: 'vault', child: 0, preg: 0, father: 0, par: null, cd: 0, tp: 0,
    look: { skin: pick(SKINS), hair: pick(HAIRS), hs: ri(0, 3) },
    px: rf(10, 100), tx: 0, wait: 0, face: 1, walk: 0,
  };
  if (o.lvl) { d.lvl = o.lvl; d.mhp = 105 + (d.lvl - 1) * (2.5 + d.sp[2] * 0.5); d.hp = d.mhp; }
  return d;
}
function genLegend() {
  const L = pick(LEGENDS);
  const d = genDweller({ g: L.g, rarity: 2, lvl: ri(3, 8) });
  d.name = L.n; d.sur = L.s; d.sp = L.sp.slice(); d.leg = true;
  d.mhp = 105 + (d.lvl - 1) * (2.5 + d.sp[2] * 0.5); d.hp = d.mhp;
  d.weapon = { u: uid(), k: 'w', id: L.w };
  d.outfit = { u: uid(), k: 'o', id: L.o };
  return d;
}
function related(a, b) {
  if (a.par && a.par.includes(b.id)) return true;
  if (b.par && b.par.includes(a.id)) return true;
  if (a.par && b.par && a.par.some(p => b.par.includes(p))) return true;
  return false;
}

// Живые жители, находящиеся в убежище
function inVault(d) { return d.st === 'vault'; }
function popCount() { return S.dwellers.length; }
function popCap() {
  let c = 10;
  for (const r of S.rooms) if (r.t === 'living') c += ROOMS.living.cap[r.l - 1] * r.s * (r.s === 1 ? 1 : r.s === 2 ? 1.05 : 1.1);
  return Math.min(200, Math.floor(c));
}
function pregnancies() { return S.dwellers.filter(d => d.preg > 0).length; }

// ===== Хранилища =====
function resCap(k) {
  if (k === 'caps') return 999999;
  if (k === 'quantum') return 9999;
  let c = 0;
  if (k === 'stim' || k === 'rad') {
    c = 5;
    const t = k === 'stim' ? 'medbay' : 'science';
    for (const r of S.rooms) if (r.t === t) c += ROOMS[t].store[r.l - 1] * r.s;
    return c;
  }
  c = 100;
  for (const r of S.rooms) {
    const def = ROOMS[r.t];
    if (!def || def.kind !== 'prod') continue;
    if (def.res === k || (def.res === 'cola' && (k === 'food' || k === 'water'))) c += def.store[r.l - 1] * r.s;
  }
  for (const r of S.rooms) if (r.t === 'storage') c += 25 * r.s * r.l;
  return c;
}
function itemCap() {
  let c = 10;
  for (const r of S.rooms) if (r.t === 'storage') c += ROOMS.storage.items[r.l - 1] * r.s;
  return c;
}
function addRes(k, n) {
  const cap = resCap(k);
  const before = S.res[k];
  S.res[k] = clamp(S.res[k] + n, 0, Math.max(cap, before));
  if (n > 0 && S.res[k] > cap) S.res[k] = Math.max(cap, before);
  return S.res[k] - before;
}
function addCaps(n) { S.res.caps += n; if (n > 0) { S.stats.capsEarned += n; objProg('caps', n); } }
function addItem(it, silent) {
  if (S.inv.length >= itemCap()) {
    const p = sellPrice(it);
    addCaps(p);
    if (!silent) toast(`Склад полон: ${itemName(it)} продан за ${p} крышек`, 'warn');
    return false;
  }
  S.inv.push(it);
  return true;
}
function newItem(k, id) { return { u: uid(), k, id }; }
function itemName(it) { return it.k === 'w' ? WEAPONS[it.id][0] : OUTFITS[it.id][0]; }
function itemRar(it) { return it.k === 'w' ? WEAPONS[it.id][3] : OUTFITS[it.id][2]; }
function sellPrice(it) {
  const r = itemRar(it);
  if (it.k === 'w') { const w = WEAPONS[it.id]; return [10, 60, 250][r] + (w[1] + w[2]) * 2; }
  const o = OUTFITS[it.id]; return [10, 60, 250][r] + o[1].reduce((a, b) => a + b, 0) * 8;
}
function itemDesc(it) {
  if (it.k === 'w') { const w = WEAPONS[it.id]; return `Урон ${w[1]}–${w[2]}`; }
  const b = OUTFITS[it.id][1];
  return b.map((v, i) => (v ? `${STAT_ABBR[i]} +${v}` : '')).filter(Boolean).join(' · ');
}
function randomItem(rar, kind) {
  const k = kind || (rnd() < 0.5 ? 'w' : 'o');
  const src = k === 'w' ? WEAPONS : OUTFITS;
  const ids = Object.keys(src).filter(id => (k === 'w' ? src[id][3] : src[id][2]) === rar);
  return newItem(k, pick(ids));
}
function rollRarity(luck, bonus = 0) {
  const r = rnd();
  if (r < 0.015 + luck * 0.003 + bonus * 0.5) return 2;
  if (r < 0.12 + luck * 0.012 + bonus) return 1;
  return 0;
}

// ===== Рецепты =====
function recipe(k, id) {
  const rar = k === 'w' ? WEAPONS[id][3] : OUTFITS[id][2];
  const rng = seeded(hashStr(k + id));
  const pool = Object.keys(JUNK).filter(j => JUNK[j][1] <= rar + 1);
  const need = {};
  const types = 2 + rar;
  for (let i = 0; i < types; i++) {
    const j = pool[Math.floor(rng() * pool.length)];
    need[j] = (need[j] || 0) + 1 + Math.floor(rng() * (2 + rar));
  }
  if (rar === 2) need[rng() < 0.5 ? 'crystal' : 'nuclear'] = 1;
  const power = k === 'w' ? WEAPONS[id][1] + WEAPONS[id][2] : OUTFITS[id][1].reduce((a, b) => a + b, 0) * 3;
  return { rar, caps: [80, 400, 1500][rar] + power * [8, 15, 25][rar], junk: need, time: [60, 150, 300][rar], lvl: rar + 1 };
}

// ===== Новая игра =====
function newGame(vaultNo) {
  S = {
    v: 1, vault: vaultNo, time: 0, saved: Date.now(), nid: 0,
    res: { power: 70, food: 70, water: 70, caps: 1200, quantum: 5, stim: 3, rad: 2 },
    rooms: [], dwellers: [], arrivals: [], inv: [], junk: {}, lunch: 1, robots: [],
    objs: [], objN: 0, quests: { list: [], active: [], refresh: 0 }, incs: [],
    timers: { arrive: 25, inc: 360, raid: 420 },
    stats: { capsEarned: 0, kills: 0, babies: 0, built: 0 },
    tut: 0, tutDone: false, adT: 0, cam: null, lastRush: 0,
  };
  S.rooms.push({ id: uid(), t: 'door', f: 0, c: 0, l: 1, s: 1, w: [], hp: DOOR_HP[0] });
  S.rooms.push({ id: uid(), t: 'elev', f: 0, c: DOOR_W, l: 1, s: 1, w: [] });
  S.rooms.push({ id: uid(), t: 'elev', f: 1, c: DOOR_W, l: 1, s: 1, w: [] });
  for (let i = 0; i < 5; i++) {
    const d = genDweller();
    d.st = 'arrive';
    if (i === 0) d.g = 'm';
    if (i === 1) { d.g = 'f'; d.name = pick(NAMES_F); }
    S.arrivals.push(d);
  }
  S.inv.push(newItem('w', 'p10'), newItem('w', 'bat'), newItem('w', 'pipe'), newItem('o', 'robe'), newItem('o', 'vest'));
  S.junk = { tape: 2, glue: 2, screw: 3, steel: 2 };
  reindex();
  for (let i = 0; i < 3; i++) addObjective();
  refreshQuests();
}

// ===== Сохранение =====
function serialize() {
  S.saved = Date.now();
  S.cam = { x: Cam.x, y: Cam.y, z: Cam.z };
  return JSON.stringify(S);
}
function saveGame(cloud) {
  if (!S) return;
  let json;
  try { json = serialize(); } catch (e) { return; }
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  if (cloud) YA.save(json);
}
function readLocal() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function hasSave() { return !!(R.cloudSave || readLocal()); }
function pickSave() {
  const a = readLocal(), b = R.cloudSave;
  if (a && b) return (b.saved || 0) > (a.saved || 0) ? b : a;
  return a || b;
}
function loadGame(data) {
  S = data;
  S.incs = S.incs || [];
  S.robots = S.robots || [];
  S.junk = S.junk || {};
  S.stats = S.stats || { capsEarned: 0, kills: 0, babies: 0, built: 0 };
  reindex();
  if (S.cam) { Cam.x = S.cam.x; Cam.y = S.cam.y; Cam.z = S.cam.z; }
  const away = clamp((Date.now() - (S.saved || Date.now())) / 1000, 0, 7200);
  if (away > 20) simOffline(away);
}

// ---- 04-sim.js ----
// ===== Комнаты: размещение, постройка, улучшение =====
function countType(t) { let n = 0; for (const r of S.rooms) if (r.t === t) n += r.t === 'elev' ? 1 : r.s; return n; }
function hasKind(k) { return S.rooms.some(r => ROOMS[r.t] && ROOMS[r.t].kind === k); }
function hasType(t) { return S.rooms.some(r => r.t === t); }
function buildCost(t) {
  if (t === 'elev') return ELEV.cost + ELEV.inc * Math.max(0, countType('elev') - 2);
  const def = ROOMS[t];
  return def.cost + def.inc * countType(t);
}
function unlocked(t) { return t === 'elev' || popCount() >= ROOMS[t].pop; }
function canPlace(t, f, c) {
  const w = t === 'elev' ? 1 : 3;
  if (c < 0 || c + w > GW || f < 0 || f >= MAXF) return false;
  for (let i = 0; i < w; i++) if (at(f, c + i)) return false;
  const L = at(f, c - 1), Rn = at(f, c + w);
  if (t === 'elev') {
    const up = at(f - 1, c), dn = at(f + 1, c);
    if ((up && up.t === 'elev') || (dn && dn.t === 'elev')) return true;
  }
  return !!(L || Rn);
}
function spotsFor(t) {
  const out = [];
  const w = t === 'elev' ? 1 : 3;
  const mf = Math.min(MAXF - 1, maxFloor() + 1);
  for (let f = 0; f <= mf; f++) for (let c = 0; c + w <= GW; c++) if (canPlace(t, f, c)) out.push({ f, c, w });
  return out;
}
function buildRoom(t, f, c) {
  const cost = buildCost(t);
  if (S.res.caps < cost) { toast('Не хватает крышек', 'bad'); Snd.bad(); return null; }
  if (!canPlace(t, f, c)) return null;
  if (t !== 'elev' && ROOMS[t].unique && hasType(t)) { toast('Такая комната уже есть', 'bad'); return null; }
  S.res.caps -= cost;
  let r = { id: uid(), t, f, c, l: 1, s: 1, w: [], p: 0, rdy: 0, heat: 0 };
  S.rooms.push(r);
  reindex();
  if (t !== 'elev') r = tryMerge(r);
  S.stats.built++;
  objProg('build', 1);
  Snd.build();
  sparks((c + (t === 'elev' ? 0.5 : 1.5)) * CW, roomY(r) + FH / 2, '#f0b429', 24);
  return r;
}
function tryMerge(r) {
  const def = ROOMS[r.t];
  if (!def || def.noMerge) return r;
  let again = true;
  while (again) {
    again = false;
    const cand = [at(r.f, r.c - 1), at(r.f, r.c + roomW(r))];
    for (const o of cand) {
      if (!o || o === r || o.t !== r.t || o.l !== r.l || o.s + r.s > 3 || incAt(o.id) || incAt(r.id) || o.craft || r.craft) continue;
      const oLeft = o.c < r.c;
      const shiftR = oLeft ? roomW(o) * CW : 0, shiftO = oLeft ? 0 : roomW(r) * CW;
      for (const d of S.dwellers) {
        if (d.room === r.id) d.px += shiftR;
        else if (d.room === o.id) { d.px += shiftO; d.room = r.id; }
      }
      r.p = (r.p * r.s + (o.p || 0) * o.s) / (r.s + o.s);
      r.rdy = (r.rdy || 0) + (o.rdy || 0);
      r.heat = Math.max(r.heat || 0, o.heat || 0);
      r.c = Math.min(r.c, o.c);
      r.s += o.s;
      r.w = oLeft ? o.w.concat(r.w) : r.w.concat(o.w);
      if (o.pair) o.pair = null;
      S.rooms.splice(S.rooms.indexOf(o), 1);
      reindex();
      again = true;
      break;
    }
  }
  return r;
}
function upgradeCost(r) {
  if (r.t === 'door') return DOOR_UP[r.l - 1];
  return ROOMS[r.t].up[r.l - 1] * r.s;
}
function upgradeRoom(r) {
  if (r.l >= 3) return;
  const cost = upgradeCost(r);
  if (S.res.caps < cost) { toast('Не хватает крышек', 'bad'); Snd.bad(); return; }
  S.res.caps -= cost;
  r.l++;
  if (r.t === 'door') r.hp = DOOR_HP[r.l - 1];
  objProg('upgrade', 1);
  Snd.build();
  sparks(roomX(r) + roomW(r) * CW / 2, roomY(r) + FH / 2, '#7ed957', 30);
  toast(`${roomName(r)}: уровень ${r.l}`, 'good');
  tryMerge(r);
}
function neighbors(r) {
  const res = [];
  const L = at(r.f, r.c - 1), Rn = at(r.f, r.c + roomW(r));
  if (L) res.push(L);
  if (Rn) res.push(Rn);
  if (r.t === 'elev') {
    const u = at(r.f - 1, r.c), dn = at(r.f + 1, r.c);
    if (u && u.t === 'elev') res.push(u);
    if (dn && dn.t === 'elev') res.push(dn);
  }
  return res;
}
function bfsFromDoor(ex) {
  const seen = new Set([door().id]);
  const order = [door()];
  for (let i = 0; i < order.length; i++) {
    for (const n of neighbors(order[i])) if (n !== ex && !seen.has(n.id)) { seen.add(n.id); order.push(n); }
  }
  return order;
}
function canDestroy(r) {
  if (r.t === 'door') return 'Дверь нельзя снести';
  if (S.dwellers.some(d => d.room === r.id)) return 'Сначала переведите всех жителей';
  if (incAt(r.id)) return 'Идёт происшествие';
  if (r.craft || r.done) return 'Идёт производство';
  if (r.t === 'elev' && r.f <= 1 && r.c === DOOR_W) return 'Главный лифт нельзя снести';
  if (bfsFromDoor(r).length !== S.rooms.length - 1) return 'Нельзя: другие комнаты потеряют связь';
  return null;
}
function destroyRoom(r) {
  const why = canDestroy(r);
  if (why) { toast(why, 'bad'); return false; }
  S.rooms.splice(S.rooms.indexOf(r), 1);
  reindex();
  sparks(roomX(r) + roomW(r) * CW / 2, roomY(r) + FH / 2, '#8a6a4a', 30);
  return true;
}

// ===== Назначение жителей =====
function workersOf(r) { return r.w.map(D).filter(Boolean); }
function freeSlots(r) { return roomCap(r) - r.w.length; }
function unassign(d) {
  if (d.room) {
    const r = RM(d.room);
    if (r) {
      const i = r.w.indexOf(d.id);
      if (i >= 0) r.w.splice(i, 1);
      if (r.pair && (r.pair.m === d.id || r.pair.f === d.id)) r.pair = null;
    }
  }
  d.room = null;
}
function assign(d, r) {
  if (d.child || d.st !== 'vault') return false;
  if (r && r.t !== 'door' && roomCap(r) === 0) return false;
  if (r && d.room === r.id && r.w.includes(d.id)) return true;
  if (r && freeSlots(r) <= 0) { toast('В комнате нет мест', 'bad'); return false; }
  const prev = d.room;
  unassign(d);
  if (r) {
    r.w.push(d.id);
    d.room = r.id;
    if (prev !== r.id) { d.px = rf(12, roomW(r) * CW - 12); d.tx = d.px; d.tp = 0; }
  }
  d.wait = 0;
  return true;
}
function autoAssign(d, prefer) {
  if (prefer) { const r = RM(prefer); if (r && freeSlots(r) > 0 && r.t !== 'door') return assign(d, r); }
  const bs = bestStat(d);
  let best = null, bestScore = -1;
  for (const r of S.rooms) {
    const def = ROOMS[r.t];
    if (!def || freeSlots(r) <= 0 || def.st < 0) continue;
    let sc = 0;
    if (def.kind === 'prod') sc = 3;
    else if (def.kind === 'living') sc = 1;
    else if (def.kind === 'radio' || def.kind === 'craft') sc = 2;
    else continue;
    if (def.st === bs) sc += 5;
    sc += stat(d, def.st) * 0.2 - r.w.length * 0.3;
    if (sc > bestScore) { bestScore = sc; best = r; }
  }
  if (best) return assign(d, best);
  d.room = null;
  return false;
}

// ===== Производство =====
function sumStat(r) {
  const def = ROOMS[r.t];
  if (!def || def.st < 0) return 0;
  let s = 0;
  for (const id of r.w) { const d = D(id); if (d && d.st === 'vault') s += stat(d, def.st); }
  return s;
}
function hapMult(r) {
  if (!r.w.length) return 1;
  let h = 0;
  for (const id of r.w) { const d = D(id); if (d) h += d.hap; }
  return 0.85 + 0.25 * (h / r.w.length) / 100;
}
const SIZE_MULT = [1, 2.1, 3.3];
function cycleTime(r) {
  const def = ROOMS[r.t];
  const ss = sumStat(r);
  if (!ss) return Infinity;
  return (def.time * r.s) / (0.3 * r.s + 0.12 * ss) / hapMult(r);
}
function roomOutput(r) { const def = ROOMS[r.t]; return Math.max(1, Math.round(def.out[r.l - 1] * SIZE_MULT[r.s - 1])); }
function luckAvg(r) {
  if (!r.w.length) return 0;
  let s = 0;
  for (const id of r.w) { const d = D(id); if (d) s += stat(d, 6); }
  return s / r.w.length;
}
function gainXp(d, n) {
  if (d.lvl >= 50 || d.st === 'dead') return;
  d.xp += n;
  if (!d.lu && d.xp >= xpNeed(d.lvl)) {
    d.lu = true;
    if (R.offline) levelUp(d, true);
  }
}
function levelUp(d, silent) {
  if (!d.lu) return;
  d.xp -= xpNeed(d.lvl);
  d.lvl++;
  const inc = 2.5 + stat(d, 2) * 0.5;
  d.mhp += inc;
  d.hp = Math.min(effMax(d), d.hp + inc);
  d.hap = 100;
  d.lu = false;
  const caps = 5 * d.lvl;
  addCaps(caps);
  objProg('levelup', 1);
  if (d.lvl < 50 && d.xp >= xpNeed(d.lvl)) d.lu = true;
  if (!silent) {

// ===== Энергия =====
function consumes(r) { return r.t === 'elev' || r.t === 'door' || (ROOMS[r.t] && ROOMS[r.t].res !== 'power'); }
function powerUse(r) { if (r.t === 'elev') return 0.004; if (r.t === 'door') return 0.01; return 0.025 * r.s; }
function isPowerRoom(r) { return ROOMS[r.t] && ROOMS[r.t].res === 'power'; }
function updatePower() {
  if (S.res.power > 0.5) { for (const r of S.rooms) r.off = false; return; }
  let budget = 0;
  const gens = S.rooms.filter(isPowerRoom);
  for (const r of gens) { r.off = false; if (r.w.length) budget += roomOutput(r) / cycleTime(r); }
  const cons = S.rooms.filter(consumes);
  const dist = r => {
    let m = 1e9;
    for (const g of gens) m = Math.min(m, Math.abs(g.f - r.f) * 4 + Math.abs(g.c - r.c) / 3);
    return m;
  };
  cons.sort((a, b) => dist(a) - dist(b));
  for (const r of cons) {
    if (r.t === 'door' || r.t === 'elev') { r.off = false; continue; }
    if (budget >= powerUse(r)) { r.off = false; budget -= powerUse(r); } else r.off = true;
  }
}

// ===== Главный цикл симуляции =====
function sim(dt) {
  S.time += dt;
  R.tick1 += dt;
  for (const r of S.rooms) updateRoom(r, dt);
  consume(dt);
  for (let i = 0; i < S.dwellers.length; i++) updateDweller(S.dwellers[i], dt);
  updatePairs(dt);
  updateIncidents(dt);
  updateQuests(dt);
  updateRobots(dt);
  if (R.tick1 >= 1) { R.tick1 -= 1; slowTick(); }
}
function consume(dt) {
  let p = 0;
  for (const r of S.rooms) if (consumes(r) && !r.off) p += powerUse(r);
  S.res.power = Math.max(0, S.res.power - p * dt);
  let eaters = 0;
  for (const d of S.dwellers) if (d.st === 'vault') eaters += d.child ? 0.5 : 1;
  S.res.food = Math.max(0, S.res.food - eaters * 0.03 * dt);
  S.res.water = Math.max(0, S.res.water - eaters * 0.03 * dt);
}
function updateRoom(r, dt) {
  const def = ROOMS[r.t];
  if (!def) return;
  if (r.heat > 0) r.heat = Math.max(0, r.heat - dt / 60);
  if (r.off || incAt(r.id) || !r.w.length) return;
  if (def.kind === 'prod' || def.kind === 'radio') {
    if (r.rdy) return;
    r.p += dt / cycleTime(r);
    if (r.p >= 1) finishCycle(r);
  } else if (def.kind === 'train') {
    const mult = [1, 1.2, 1.4][r.l - 1] * hapMult(r);
    for (const id of r.w) {
      const d = D(id);
      if (!d || d.sp[def.st] >= 10) continue;
      d.tp += (dt * mult) / (40 * (1 + d.sp[def.st] * 0.45));
      if (d.tp >= 1) {
        d.tp = 0;
        d.sp[def.st]++;
        objProg('train', 1);
        gainXp(d, 10);
        if (!R.offline) {
          toast(`${fullName(d)}: ${STAT_NAMES[def.st]} ${d.sp[def.st]}`, 'good');
          const p = dwellerWorldPos(d);
          if (p) floatText(p.x, p.y - 36, `${STAT_ABBR[def.st]} +1`, '#7ed957');
        }
      }
    }
  } else if (def.kind === 'craft' && r.craft && !r.done) {
    const ss = sumStat(r);
    r.craft.p += (dt * (0.4 + 0.12 * ss)) / r.craft.T;
    if (r.craft.p >= 1) {
      r.done = newItem(r.craft.k, r.craft.id);
      r.craft = null;
      for (const id of r.w) { const d = D(id); if (d) gainXp(d, 25); }
      if (R.offline) collectRoom(r, true); else toast('Предмет готов — заберите в мастерской', 'good');
    }
  }
}
function startCraft(r, k, id) {
  const rc = recipe(k, id);
  if (r.l < rc.lvl) { toast(`Нужна мастерская ${rc.lvl} уровня`, 'bad'); return false; }
  if (S.res.caps < rc.caps) { toast('Не хватает крышек', 'bad'); return false; }
  for (const j in rc.junk) if ((S.junk[j] || 0) < rc.junk[j]) { toast(`Не хватает: ${JUNK[j][0]}`, 'bad'); return false; }
  S.res.caps -= rc.caps;
  for (const j in rc.junk) S.junk[j] -= rc.junk[j];
  r.craft = { k, id, p: 0, T: rc.time };

// ===== Жители: движение, здоровье, дети =====
function incAt(roomId) { for (const i of S.incs) if (i.room === roomId) return i; return null; }
function dwellerRoom(d) { return d.room ? RM(d.room) : door(); }
function dwellerWorldPos(d) {

  if (d.st === 'dead' && d.deadIn !== 'vault') return null;

}
function updateDweller(d, dt) {

  if (d.st !== 'vault') return;
  // здоровье
  const r = dwellerRoom(d);
  const inc = r ? incAt(r.id) : null;
  if (S.res.food > 0 && !inc) d.hp = Math.min(effMax(d), d.hp + 0.25 * dt);
  else if (S.res.food <= 0) d.hp = Math.max(Math.min(5, d.hp), d.hp - 0.12 * dt);

  if (d.child > 0) { d.child -= dt; if (d.child <= 0) { d.child = 0; growUp(d); } }

}
function moveDweller(d, dt, r, inc) {

  } else {
    d.hide = false;

// ===== Знакомства в жилых помещениях =====
function updatePairs(dt) {

    if (!p) continue;

    if (!m || !f || m.room !== r.id || f.room !== r.id || m.st !== 'vault' || f.st !== 'vault' || incAt(r.id)) { r.pair = null; if (m) m.hide = false; if (f) f.hide = false; continue; }
    p.t += dt;

    if (p.ph === 0 && p.t > talk) { p.ph = 1; p.t = 0; }
    else if (p.ph === 1 && p.t > 5) {
      if (popCount() + pregnancies() >= popCap()) { r.pair = null; m.cd = f.cd = S.time + 60; continue; }
      p.ph = 2; p.t = 0;
    } else if (p.ph === 2 && p.t > 4) {
      m.hide = f.hide = false;
      f.preg = 120; f.father = m.id;
      m.cd = S.time + 60; f.cd = S.time + 60;
      m.hap = Math.min(100, m.hap + 15); f.hap = Math.min(100, f.hap + 15);
      r.pair = null;

    }

}
function tryPairing(r) {

  const ms = ws.filter(d => d.g === 'm'), fs = ws.filter(d => d.g === 'f');

// ===== Медицина =====

// ===== Прибытие новых жителей =====

// ===== Происшествия =====

    const alive = inc.en.filter(x => x.hp > 0);
    const breach = inc.ext && r.t === 'door' && r.hp > 0;
    // жители атакуют
    for (const d of defs) {
      if (!alive.length) break;
      const tgt = alive[d.id % alive.length];
      const dmg = inc.k === 'fire' ? (1.5 + 0.05 * d.lvl + stat(d, 2) * 0.05) : dwellerDps(d);
      tgt.hp -= dmg * dt;
      d.fight = 0.3;
      if (tgt.hp <= 0) {
        S.stats.kills++;
        if (inc.k !== 'fire') objProg('kill', 1);
        for (const x of defs) gainXp(x, 4);
        alive.splice(alive.indexOf(tgt), 1);
      }
    }
    // пожар без людей постепенно выгорает
    if (inc.k === 'fire' && !defs.length) {
      for (const x of alive) x.hp -= 0.5 * dt;
      for (let j = alive.length - 1; j >= 0; j--) if (alive[j].hp <= 0) alive.splice(j, 1);
    }
    // враги атакуют
    if (breach) {
      let dps = 0;
      for (const x of alive) dps += e.dps * dpsMul;
      r.hp = Math.max(0, r.hp - dps * dt);
      if (r.hp <= 0 && !R.offline) { toast(`${e.n} выломали дверь!`, 'bad'); Snd.alarm(); for (const x of alive) x.x = rf(20, 60); }
    } else if (defs.length) {
      if (inc.k === 'fire') {
        for (const d of defs) hurt(d, e.dps * dpsMul * alive.length * dt * 0.6);
      } else {
        for (const x of alive) {
          const d = defs[x.tg % defs.length];
          hurt(d, e.dps * dpsMul * dt, e.rad ? e.rad * dt : 0);
        }
      }
    }
    // исход
    if (!alive.length) {
      S.incs.splice(i, 1);
      const reward = defs.length ? Math.round(e.reward * (inc.ext ? inc.en.length : Math.max(1, r.s)) * (0.8 + th * 0.2)) : 0;
      addCaps(reward);
      if (inc.k === 'fire') objProg('fire', 1);
      for (const d of defs) gainXp(d, 15);
      if (inc.ext) door().hp = DOOR_HP[door().l - 1];
      if (!R.offline) {
        if (reward) {
          toast(`${e.n} — угроза устранена! +${reward} крышек`, 'good');
          floatText(roomX(r) + roomW(r) * CW / 2, roomY(r) + 20, `+${reward}`, RES_COL.caps, 'caps');
          Snd.coin();
        } else toast(`${e.n}: огонь выгорел в «${roomName(r)}»`, 'warn');
      }
      continue;
    }
    if (inc.ext) {
      if (breach) continue;
      const stay = defs.length ? 22 : 6;
      if (inc.t >= stay) {
        if (!defs.length && e.steal) {
          const s = Math.min(600, Math.floor(S.res.caps * e.steal));
          S.res.caps -= s; inc.stolen += s;
        }
        let next = null;
        while (inc.path && ++inc.pi < inc.path.length) {
          const c = RM(inc.path[inc.pi]);
          if (c && !incAt(c.id)) { next = c; break; }
        }
        if (!next) {
          S.incs.splice(i, 1);
          door().hp = DOOR_HP[door().l - 1];
          if (!R.offline) toast(`${e.n} ушли${inc.stolen ? `, украв ${inc.stolen} крышек` : ''}`, 'warn');
          continue;
        }
        inc.room = next.id;
        inc.t = 0;
        const w = roomW(next) * CW;
        for (const x of inc.en) x.x = rf(14, Math.min(60, w - 14));
      }
    } else {
      const spreadT = defs.length ? 30 : 16;
      if (inc.t >= spreadT) {
        inc.t = 0;
        if (S.incs.length < 5 && (inc.gen || 0) < 2) {
          const nb = neighbors(r).filter(n => n.t !== 'elev' && n.t !== 'door' && !incAt(n.id));
          if (nb.length) {
            const n = pick(nb);
            startIncident(inc.k, n, true, (inc.gen || 0) + 1);
            if (!R.offline) toast(`${e.n} распространяется: ${roomName(n)}`, 'bad');
          }
        }
      }
    }
    // анимация врагов
    const w = roomW(r) * CW;
    for (const x of inc.en) {
      if (x.hp <= 0) continue;
      x.ph += dt;
      if (breach) x.x = clamp(x.x + Math.sin(x.ph * 2) * dt * 10, -110, -8);
      else if (inc.k !== 'fire') x.x = clamp(x.x + Math.sin(x.ph * 1.3 + x.tg) * dt * 30, 10, w - 10);
    }
  }
}

// ===== Пустошь =====
function sendExplore(d, stims, rads) {
  if (d.st !== 'vault' || d.child) return false;
  stims = Math.min(stims, Math.floor(S.res.stim));
  rads = Math.min(rads, Math.floor(S.res.rad));
  S.res.stim -= stims;
  S.res.rad -= rads;
  d.prev = d.room;
  unassign(d);
  d.st = 'explore';
  d.ex = { t: 0, back: -1, caps: 0, items: [], junk: {}, log: [], stim: stims, radw: rads, nev: 6, xp: 0, home: false };
  exLog(d, 'Покинул(а) убежище. Пустошь ждёт.');
  objProg('explore', 1);
  Snd.open();
  return true;
}
function exLog(d, msg) {
  d.ex.log.push({ t: d.ex.t, m: msg });
  if (d.ex.log.length > 60) d.ex.log.shift();
}
function recallExplorer(d) {
  if (d.st !== 'explore' || d.ex.back >= 0) return;
  d.ex.back = d.ex.t / 2;
  d.ex.backT = d.ex.back;
  exLog(d, 'Возвращаюсь домой.');
}
function updateExplorer(d, dt) {
  const ex = d.ex;
  if (!ex || ex.home) return;
  if (ex.back >= 0) {
    ex.back -= dt;
    if (ex.back <= 0) {
      ex.back = 0;
      ex.home = true;
      exLog(d, 'Вернулся(ась) к двери убежища.');
      if (!R.offline) { toast(`${fullName(d)} вернулся(ась) из Пустоши`, 'good'); Snd.open(); }
    }
    return;
  }
  ex.t += dt;
  // радиация пустоши
  d.rad = Math.min(d.mhp - 1, d.rad + dt * 0.03 * (1 - clamp(stat(d, 2), 0, 15) * 0.05));
  if (d.hp > effMax(d)) d.hp = effMax(d);
  ex.nev -= dt;
  if (ex.nev <= 0) { ex.nev = rf(10, 17); wasteEvent(d); }
  if (d.st !== 'explore') return;
  if (d.hp < effMax(d) * 0.45 && ex.stim > 0) {
    ex.stim--; d.hp = Math.min(effMax(d), d.hp + d.mhp * 0.45);
    exLog(d, 'Использовал(а) аптечку.');
  }
  if (d.rad > d.mhp * 0.35 && ex.radw > 0) {
    ex.radw--; d.rad = Math.max(0, d.rad - d.mhp * 0.45);
    exLog(d, 'Принял(а) антирадин.');
  }
}
function wasteEvent(d) {
  const ex = d.ex;
  const lv = 1 + ex.t / 120;
  const L = stat(d, 6), P = stat(d, 1), C = stat(d, 3), I = stat(d, 4);
  const place = pick(WASTE_PLACES);
  const kind = weighted([['caps', 26 + L], ['junk', 16 + P], ['item', 9 + P * 0.6 + L * 0.4], ['fight', 15 + lv * 1.2], ['friend', 6 + C], ['loc', 8 + I], ['none', 8]]);
  if (kind === 'caps') {
    const n = Math.round(ri(3, 12) * (1 + L * 0.08) * (1 + ex.t / 400));
    ex.caps += n;
    exLog(d, `Нашёл(а) ${n} крышек ${place}.`);
  } else if (kind === 'junk') {
    const rar = rnd() < 0.02 + L * 0.004 ? 3 : rnd() < 0.08 + L * 0.01 ? 2 : rnd() < 0.3 ? 1 : 0;
    const ids = Object.keys(JUNK).filter(j => JUNK[j][1] === rar);
    const j = pick(ids);
    const n = ri(1, 2);
    ex.junk[j] = (ex.junk[j] || 0) + n;
    exLog(d, `Подобрал(а) хлам: ${JUNK[j][0]} ×${n} ${place}.`);
  } else if (kind === 'item') {
    const it = randomItem(rollRarity(L, ex.t / 8000));
    ex.items.push(it);
    exLog(d, `${['Нашёл(а)', 'Отыскал(а) редкую вещь:', 'ЛЕГЕНДАРНАЯ находка:'][itemRar(it)]} ${itemName(it)}!`);
  } else if (kind === 'fight') {
    const pool = WASTE_ENEMY.filter(e => e.lv <= lv);
    const e = pool[Math.min(pool.length - 1, Math.floor(Math.pow(rnd(), 1.3) * pool.length))];
    const eHp = e.hp * (0.8 + lv * 0.15);
    const myDps = dwellerDps(d) * (1 + stat(d, 0) * 0.02);
    const tkill = eHp / myDps;
    let dmg = 0.45 * e.dps * (0.8 + lv * 0.08) * Math.min(tkill, 8 + lv * 2) * (1 - clamp(stat(d, 2), 0, 17) * 0.03) * (1 - clamp(stat(d, 5), 0, 17) * 0.02);
    dmg = Math.max(1, Math.round(dmg));
    d.hp -= dmg;
    if (e.rad) d.rad = Math.min(d.mhp - 1, d.rad + e.rad);
    const xp = Math.round(e.xp * (0.8 + lv * 0.2));
    if (d.hp <= 0) {
      d.hp = 0;
      exLog(d, `Погиб(ла) в схватке: ${e.n}.`);
      d.st = 'dead';
      d.deadIn = 'waste';
      if (!R.offline) { toast(`${fullName(d)} погиб(ла) в Пустоши`, 'bad'); Snd.bad(); }
      return;
    }
    ex.xp += xp;
    let msg = `Бой: ${e.n}. Победа! Потеряно ${dmg} ОЗ.`;
    if (rnd() < 0.35) { const n = ri(5, 20); ex.caps += n; msg += ` +${n} крышек.`; }
    exLog(d, msg);
  } else if (kind === 'friend') {
    const r = rnd();
    if (r < 0.4) { const n = Math.round(ri(10, 30) * (1 + C * 0.1)); ex.caps += n; exLog(d, `Встретил(а) торговца и выгодно сторговался(ась): +${n} крышек.`); }
    else if (r < 0.7) { ex.stim++; exLog(d, 'Путник поделился аптечкой.'); }
    else { ex.xp += 20; exLog(d, 'Помог(ла) поселенцам починить водокачку. Опыт +20.'); }
  } else if (kind === 'loc') {
    ex.xp += Math.round(10 + I * 2);
    const r = rnd();
    if (r < 0.3) { ex.radw++; exLog(d, `Исследовал(а) ${place.replace(/^(в|у|на) /, '')} и нашёл(ла) антирадин.`); }
    else if (r < 0.55) { ex.stim++; exLog(d, `Обыскал(а) аптечку ${place}: +1 аптечка.`); }
    else exLog(d, `Изучил(а) довоенные записи ${place}. Опыт +${Math.round(10 + I * 2)}.`);
  } else {
    exLog(d, pick(WASTE_FLAVOR));
  }
}
function collectExplorer(d) {
  const ex = d.ex;
  if (!ex || !ex.home) return;
  addCaps(ex.caps);
  let sold = 0;
  for (const it of ex.items) if (!addItem(it, true)) sold++;
  for (const j in ex.junk) S.junk[j] = Math.min(99, (S.junk[j] || 0) + ex.junk[j]);
  S.res.stim = Math.min(Math.max(resCap('stim'), S.res.stim), S.res.stim + ex.stim);
  S.res.rad = Math.min(Math.max(resCap('rad'), S.res.rad), S.res.rad + ex.radw);
  gainXp(d, ex.xp);
  toast(`${fullName(d)}: +${ex.caps} крышек, предметов: ${ex.items.length}${sold ? ` (продано из-за склада: ${sold})` : ''}`, 'good');
  Snd.coin();
  d.ex = null;
  d.st = 'vault';
  d.room = null;
  autoAssign(d, d.prev);
}

// ===== Задания смотрителя =====
function avgLevel() {
  const a = S.dwellers.filter(d => !d.child && d.st !== 'dead');
  return a.length ? a.reduce((s, d) => s + d.lvl, 0) / a.length : 1;
}
function refreshQuests() {
  const used = new Set(S.quests.active.map(q => q.n));
  const al = avgLevel();
  const list = [];
  const pool = QUESTS.filter(q => !used.has(q[0]));
  for (let i = 0; i < 3 && pool.length; i++) {
    const q = pool.splice(ri(0, pool.length - 1), 1)[0];
    const lvl = Math.max(1, Math.round(al + i * 2 + rf(-1, 2)));
    const rar = i === 2 ? 1 : 0;
    list.push({
      id: uid(), n: q[0], desc: q[1], lvl, dur: ri(50, 90) + i * 30, diff: 30 + lvl * 22 + i * 25,
      rw: { caps: Math.round((120 + lvl * 40) * (1 + i * 0.4)), item: rar + (rnd() < 0.1 ? 1 : 0), lunch: rnd() < 0.2 + i * 0.1 ? 1 : 0, quantum: rnd() < 0.2 ? ri(1, 3) : 0 },
    });
  }
  S.quests.list = list;
  S.quests.refresh = S.time + 600;
}
function teamPower(team) {
  let p = 0;
  for (const d of team) p += dwellerDps(d) * 6 + d.lvl * 4 + effMax(d) * 0.15 + stat(d, 0) + stat(d, 2) + stat(d, 5);
  return p;
}
function startQuest(q, ids) {
  const team = ids.map(D).filter(d => d && d.st === 'vault' && !d.child);
  if (!team.length) return false;
  for (const d of team) { d.prev = d.room; unassign(d); d.st = 'quest'; }
  S.quests.list = S.quests.list.filter(x => x !== q);
  q.team = team.map(d => d.id);
  q.stage = 'go';
  q.left = q.dur;
  q.chance = clamp(teamPower(team) / q.diff, 0.1, 0.97);
  S.quests.active.push(q);
  Snd.open();
  return true;
}
function updateQuests(dt) {
  if (!hasType('overseer')) return;
  if (S.time > S.quests.refresh || (!S.quests.list.length && S.quests.active.length < 3)) refreshQuests();
  for (const q of S.quests.active) {
    if (q.stage === 'done') continue;
    q.left -= dt;
    if (q.left > 0) continue;
    if (q.stage === 'go') {
      const team = q.team.map(D).filter(Boolean);
      q.ok = rnd() < q.chance;
      for (const d of team) {
        const loss = (q.ok ? rf(0.1, 0.4) : rf(0.5, 0.8)) * d.mhp;
        d.hp = Math.max(1, d.hp - loss);
      }
      q.stage = 'back';
      q.left = q.dur / 2;
    } else if (q.stage === 'back') {
      q.stage = 'done';
      if (!R.offline) { toast(`Отряд вернулся: «${q.n}» — ${q.ok ? 'успех!' : 'провал'}`, q.ok ? 'good' : 'bad'); Snd.open(); }
    }
  }
}
function collectQuest(q) {
  const team = q.team.map(D).filter(Boolean);
  const xp = q.ok ? 60 + q.lvl * 15 : 20;
  for (const d of team) { gainXp(d, xp); d.st = 'vault'; d.room = null; autoAssign(d, d.prev); }
  const got = [];
  if (q.ok) {
    addCaps(q.rw.caps); got.push(`${q.rw.caps} крышек`);
    const it = randomItem(Math.min(2, q.rw.item));
    addItem(it); got.push(itemName(it));
    if (q.rw.lunch) { S.lunch += q.rw.lunch; got.push('ящик снабжения'); }
    if (q.rw.quantum) { S.res.quantum += q.rw.quantum; got.push(`${q.rw.quantum} Атом-колы`); }
    objProg('quest', 1);
  }
  S.quests.active.splice(S.quests.active.indexOf(q), 1);
  toast(q.ok ? `Награда: ${got.join(', ')}` : 'Отряд вернулся ни с чем, но набрался опыта', q.ok ? 'good' : 'warn');
  Snd.coin();
}

// ===== Цели =====
function objNeed(n) {
  if (!n) return true;
  if (n === 'living') return hasType('living');
  if (n === 'overseer') return hasType('overseer');
  return hasKind(n);
}
function addObjective() {
  const avail = OBJ_T.filter(o => !S.objs.some(x => x.k === o.k) && objNeed(o.need));
  const o = pick(avail);
  const tier = Math.floor(S.objN / 3);
  const n = o.b + o.g * tier;
  let rw;
  if (S.objN % 4 === 3) rw = { lunch: 1 };
  else if (rnd() < 0.15) rw = { quantum: ri(1, 3) };
  else rw = { caps: 50 + 25 * tier + ri(0, 5) * 10 };
  S.objs.push({ k: o.k, t: o.t.replace('{n}', fmt(n)), n, p: 0, rw });
  S.objN++;
}
function objProg(k, n) {
  if (!S || !S.objs) return;
  for (const o of S.objs) {
    if (o.k !== k || o.p >= o.n) continue;
    o.p = Math.min(o.n, o.p + n);
    if (o.p >= o.n && !R.offline) { toast(`Цель выполнена: ${o.t}`, 'good'); Snd.coin(); }
  }
}
function claimObjective(i) {
  const o = S.objs[i];
  if (!o || o.p < o.n) return;
  if (o.rw.caps) addCaps(o.rw.caps);
  if (o.rw.quantum) S.res.quantum += o.rw.quantum;
  if (o.rw.lunch) S.lunch += o.rw.lunch;
  S.objs.splice(i, 1);
  addObjective();
  Snd.coin();
}
function rewardText(rw) {
  if (rw.caps) return `${rw.caps} крышек`;
  if (rw.quantum) return `${rw.quantum} Атом-колы`;
  if (rw.lunch) return 'Ящик снабжения';
  return '';
}

// ===== Ящики снабжения =====
function openLunchbox() {
  if (S.lunch < 1) return null;
  S.lunch--;
  const cards = [];
  for (let i = 0; i < 4; i++) {
    const t = weighted([['caps', 28], ['res', 22], ['w', 16], ['o', 16], ['junk', 9], ['dw', 5], ['q', 3], ['robot', 1.2]]);
    cards.push(makeCard(t));
  }
  if (!cards.some(c => c.rar >= 1)) cards[3] = makeCard(rnd() < 0.5 ? 'w' : 'o', 1);
  for (const c of cards) c.apply();
  return cards;
}
function makeCard(t, forceRar) {
  if (t === 'caps') {
    const n = weighted([[100, 30], [250, 30], [500, 20], [1000, 6]]);
    return { t, rar: n >= 1000 ? 2 : n >= 500 ? 1 : 0, icon: 'caps', col: RES_COL.caps, title: `${n} крышек`, apply: () => addCaps(n) };
  }
  if (t === 'res') {
    const k = pick(['power', 'food', 'water', 'stim', 'rad']);
    const n = k === 'stim' || k === 'rad' ? 3 : 150;
    return { t, rar: 0, icon: RES_ICON[k], col: RES_COL[k], title: `${RES_NAMES[k]} +${n}`, apply: () => { S.res[k] = Math.max(S.res[k], Math.min(S.res[k] + n, Math.max(resCap(k), S.res[k] + n))); } };
  }
  if (t === 'w' || t === 'o') {
    const it = randomItem(forceRar != null ? forceRar : rollRarity(2, 0.12), t);
    return { t, rar: itemRar(it), icon: t === 'w' ? 'gun' : 'shirt', col: RAR_COL[itemRar(it)], title: itemName(it), sub: itemDesc(it), apply: () => addItem(it) };
  }
  if (t === 'junk') {
    const js = {};
    for (let i = 0; i < 3; i++) { const j = pick(Object.keys(JUNK)); js[j] = (js[j] || 0) + ri(1, 2); }
    return { t, rar: 0, icon: 'junk', col: '#b9a57a', title: 'Хлам', sub: Object.keys(js).map(j => `${JUNK[j][0]} ×${js[j]}`).join(', '), apply: () => { for (const j in js) S.junk[j] = Math.min(99, (S.junk[j] || 0) + js[j]); } };
  }
  if (t === 'dw') {
    const rar = rnd() < 0.35 ? 2 : 1;
    const d = rar === 2 ? genLegend() : genDweller({ rarity: 1 });
    d.st = 'arrive';
    return { t, rar, icon: 'people', col: RAR_COL[rar], title: fullName(d), sub: rar === 2 ? 'Легендарный житель ждёт у двери' : 'Редкий житель ждёт у двери', apply: () => S.arrivals.push(d) };
  }
  if (t === 'q') {
    const n = ri(2, 5);
    return { t, rar: 1, icon: 'quantum', col: RES_COL.quantum, title: `Атом-кола ×${n}`, apply: () => { S.res.quantum += n; } };
  }
  if (S.robots.length >= 3) return makeCard('caps');
  return { t: 'robot', rar: 2, icon: 'robot', col: RAR_COL[2], title: 'Робот-помощник', sub: 'Сам собирает ресурсы на своём этаже', apply: () => S.robots.push({ f: 0, x: 200, dir: 1, cd: 0 }) };
}

// ===== Роботы-помощники =====
function updateRobots(dt) {
  for (const b of S.robots) {
    const rooms = S.rooms.filter(r => r.f === b.f && r.t !== 'elev');
    if (!rooms.length) { b.f = 0; continue; }
    const minX = Math.min(...rooms.map(r => roomX(r))) + 20, maxX = Math.max(...rooms.map(r => roomX(r) + roomW(r) * CW)) - 20;
    b.x += b.dir * 30 * dt;
    if (b.x > maxX) { b.x = maxX; b.dir = -1; }
    if (b.x < minX) { b.x = minX; b.dir = 1; }
    b.cd -= dt;
    if (b.cd <= 0) {
      b.cd = 3;
      for (const r of rooms) if ((r.rdy || r.done) && b.x >= roomX(r) && b.x <= roomX(r) + roomW(r) * CW) collectRoom(r, true);
    }
  }
}

// ===== Медленный тик (1 раз в секунду) =====
function slowTick() {
  updatePower();
  // радио
  let radio = 0;
  for (const r of S.rooms) if (r.t === 'radio' && r.w.length && !r.off) radio += 4 + r.l * 2;
  radio = Math.min(20, radio);
  // счастье
  for (const d of S.dwellers) {
    if (d.st !== 'vault') continue;
    let t;
    if (d.child) t = 85;
    else {
      t = 50;
      const r = d.room ? RM(d.room) : null;
      if (!r) t -= 15;
      else {
        const def = ROOMS[r.t];
        if (def && def.st >= 0) { const v = stat(d, def.st), b = stat(d, bestStat(d)); t += 10 + 25 * (v / Math.max(1, b)); if (def.kind === 'train') t += 5; }
        else if (r.t === 'door') t += 20;
        if (r.off) t -= 15;
        if (incAt(r.id)) t -= 10;
      }
      if (d.preg) t += 10;
    }
    if (S.res.food <= 0) t -= 25;
    if (S.res.water <= 0) t -= 25;
    if (d.hp < effMax(d) * 0.5) t -= 10;
    if (d.rad > d.mhp * 0.3) t -= 10;
    t = clamp(t + radio, 5, 100);
    d.hap += (t - d.hap) * 0.012;
  }
  // знакомства
  for (const r of S.rooms) if (r.t === 'living') tryPairing(r);
  // прибытия
  const pop = popCount();
  S.timers.arrive -= 1;
  if (S.timers.arrive <= 0) {
    if (pop < 40 && S.arrivals.length < 4 && pop + S.arrivals.length < popCap() + 2) {
      spawnArrival(rnd() < 0.08 ? 1 : 0);
      if (!R.offline) toast('У двери новый выживший', 'good');
    }
    S.timers.arrive = pop < 20 ? ri(60, 120) : ri(200, 360);
  }
  // случайные происшествия и набеги
  if (S.tutDone && !R.offline) {
    S.timers.inc -= 1;
    if (S.timers.inc <= 0) {
      S.timers.inc = ri(240, 480);
      const cand = S.rooms.filter(r => ROOMS[r.t] && r.w.length && !incAt(r.id));
      if (cand.length && pop >= 6) {
        let k = pick(['fire', 'roach']);
        if (pop >= 30 && rnd() < 0.3) k = 'molerat';
        if (pop >= 50 && rnd() < 0.15) k = 'scorp';
        startIncident(k, pick(cand));
      }
    }
    S.timers.raid -= 1;
    if (S.timers.raid <= 0) {
      S.timers.raid = ri(360, 660);
      if (pop >= 6 && !S.incs.some(i => i.ext)) {
        let k = 'raider';
        if (pop >= 35 && rnd() < 0.35) k = 'ghoul';
        if (pop >= 60 && rnd() < 0.3) k = 'beast';
        startRaid(k);
      }
    }
  }
  // обучение
  if (!S.tutDone) {
    if (S.tut === 0 && S.dwellers.length > 0) S.tut = 1;
    if (S.tut === 1 && S.rooms.some(r => ROOMS[r.t] && ROOMS[r.t].res === 'power')) S.tut = 2;
    if (S.tut === 2 && hasType('diner') && hasType('water')) S.tut = 3;
    if (S.tut === 3 && ['power', 'diner', 'water'].every(t => S.rooms.some(r => r.t === t && r.w.length))) S.tut = 4;
    if (S.tut === 5 && hasType('living')) { S.tut = 6; S.tutT = 14; }
    if (S.tut === 6) { S.tutT = (S.tutT || 14) - 1; if (S.tutT <= 0) S.tutDone = true; }
  }
}

// ===== Офлайн-прогресс =====
function simOffline(sec) {
  const before = { caps: S.res.caps, food: S.res.food, water: S.res.water, power: S.res.power, pop: popCount() };
  R.offline = true;
  const step = 1;
  for (let t = 0; t < sec; t += step) sim(step);
  R.offline = false;
  R.offlineReport = { sec, caps: Math.round(S.res.caps - before.caps), births: popCount() - before.pop };
}

// ===== Камера и отрисовка =====
const Cam = { x: -140, y: 40, z: 1, vw: 1, vh: 1, dpr: 1, top: 0, bot: 0 };
let cv, ctx, rockPat = null, dirtPat = null;
const FONT_D = '"Russo One", "Arial Black", Impact, sans-serif';
const FONT_B = '"PT Sans Narrow", "Roboto Condensed", "Arial Narrow", sans-serif';

function shade(hex, a) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const n = parseInt(c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (a < 0) { r *= 1 + a; g *= 1 + a; b *= 1 + a; } else { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function makePatterns() {
  const mk = (base, dots, seed) => {
    const c = document.createElement('canvas');
    c.width = c.height = 160;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 160, 160);
    const rng = seeded(seed);
    for (let i = 0; i < 90; i++) {
      const x = rng() * 160, y = rng() * 160, r = 2 + rng() * 9;
      g.fillStyle = dots[Math.floor(rng() * dots.length)];
      g.beginPath(); g.ellipse(x, y, r, r * (0.5 + rng() * 0.4), rng() * 3, 0, 7); g.fill();
    }
    for (let i = 0; i < 400; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(0,0,0,.18)' : 'rgba(255,230,200,.05)'; g.fillRect(rng() * 160, rng() * 160, 1.5, 1.5); }
    return ctx.createPattern(c, 'repeat');
  };
  rockPat = mk('#3a2b20', ['#33261c', '#45342690', '#2c2018', '#4a382a'], 7);
  dirtPat = mk('#5a4330', ['#4d3928', '#6a5038', '#503b2a'], 11);
}
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  Cam.dpr = dpr;
  Cam.vw = cv.clientWidth || window.innerWidth;
  Cam.vh = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(Cam.vw * dpr);
  cv.height = Math.round(Cam.vh * dpr);
  const hud = document.getElementById('hud'), bar = document.getElementById('bar');
  Cam.top = hud ? hud.getBoundingClientRect().bottom : 0;
  Cam.bot = bar ? Cam.vh - bar.getBoundingClientRect().top : 0;
  document.documentElement.style.setProperty('--hud-h', Math.round(hud ? hud.getBoundingClientRect().bottom : 0) + 'px');
  if (S) clampCam();
}
function worldBounds() {
  return { x0: -OUTW, x1: GW * CW + 50, y0: 0, y1: SURF + (Math.min(MAXF, maxFloor() + 2)) * FH + 30 };
}
function minZoom() { const b = worldBounds(); return clamp(Math.min(Cam.vw / (b.x1 - b.x0), 0.9), 0.28, 0.9); }
function clampCam() {
  const b = worldBounds();
  Cam.z = clamp(Cam.z, minZoom(), 2.6);
  const vw = Cam.vw / Cam.z, vh = Cam.vh / Cam.z;
  const t = Cam.top / Cam.z, bt = Math.max(Cam.bot, R.sheetH || 0) / Cam.z;
  const xmin = b.x0, xmax = b.x1 - vw;
  Cam.x = xmax < xmin ? (b.x0 + b.x1 - vw) / 2 : clamp(Cam.x, xmin, xmax);
  const ymin = b.y0 - t, ymax = b.y1 + bt - vh;
  Cam.y = ymax < ymin ? ymin : clamp(Cam.y, ymin, ymax);
}
function zoomAt(sx, sy, nz) {
  const wx = Cam.x + sx / Cam.z, wy = Cam.y + sy / Cam.z;
  Cam.z = clamp(nz, minZoom(), 2.6);
  Cam.x = wx - sx / Cam.z;
  Cam.y = wy - sy / Cam.z;

}
function centerOn(wx, wy, z) {
  if (z) Cam.z = clamp(z, minZoom(), 2.6);
  const midY = Cam.top + (Cam.vh - Cam.top - Cam.bot) / 2;
  Cam.x = wx - Cam.vw / 2 / Cam.z;

}
function revealAbove(wx, wy) {

}
function toWorld(sx, sy) { return { x: Cam.x + sx / Cam.z, y: Cam.y + sy / Cam.z }; }

// ===== Эффекты =====
function floatText(x, y, text, col, icon) { if (R.offline) return; R.floaters.push({ x, y, text, col, icon, t: 0 }); }
function floatHeart(x, y) { for (let i = 0; i < 6; i++) R.parts.push({ x: x + rf(-10, 10), y, vx: rf(-8, 8), vy: rf(-30, -15), t: 0, life: 1.6, col: '#ef5470', heart: true, s: rf(5, 8) }); }

// ===== Кадр =====
function render(time) {
  const t = time / 1000;
  ctx.setTransform(Cam.dpr, 0, 0, Cam.dpr, 0, 0);

  ctx.fillRect(0, 0, Cam.vw, Cam.vh);

  const z = Cam.z * Cam.dpr;
  ctx.setTransform(z, 0, 0, z, -Cam.x * z, -Cam.y * z);
  const view = { x0: Cam.x - 20, y0: Cam.y - 20, x1: Cam.x + Cam.vw / Cam.z + 20, y1: Cam.y + Cam.vh / Cam.z + 20 };
  drawWorldBg(t, view);
  for (const r of S.rooms) {
    const x = roomX(r), y = roomY(r), w = roomW(r) * CW;
    if (x > view.x1 || x + w < view.x0 || y > view.y1 || y + FH < view.y0) continue;
    drawRoom(r, x, y, w, t);
  }

  // жители
  for (const d of S.dwellers) {
    if (d.st === 'dead' && d.deadIn === 'vault') { const p = dwellerWorldPos(d); if (p) drawGrave(p.x, p.y); continue; }
    if (d.st !== 'vault' || d.hide) continue;
    const p = dwellerWorldPos(d);
    if (!p || p.x < view.x0 || p.x > view.x1 || p.y < view.y0 || p.y - 40 > view.y1) continue;

  for (const inc of S.incs) {
    const r = RM(inc.room);
    if (r) drawEnemies(inc, r, t);
  }
  for (const r of S.rooms) {
    if (r.pair && r.pair.ph === 2) drawHearts(roomX(r) + roomW(r) * CW / 2, roomY(r) + FH / 2, t);
  }
  drawRobots(t);
  drawBubbles(t);

  }
  drawFx(t);

  if (S.incs.length) {
    const a = 0.1 + 0.08 * Math.sin(t * 5) + R.flash * 0.25;
    const g = ctx.createRadialGradient(Cam.vw / 2, Cam.vh / 2, Math.min(Cam.vw, Cam.vh) * 0.35, Cam.vw / 2, Cam.vh / 2, Math.max(Cam.vw, Cam.vh) * 0.75);
    g.addColorStop(0, 'rgba(200,30,20,0)');
    g.addColorStop(1, `rgba(200,30,20,${a})`);

    ctx.fillRect(0, 0, Cam.vw, Cam.vh);

}

function drawWorldBg(t, v) {

  ctx.lineTo(b.x1 + 400, b.y1 + 4000);

  }

  ctx.fillStyle = '#7d4a32'; ctx.beginPath(); ctx.roundRect(cx - 14, cy - 26, 28, 12, 5); ctx.fill();
  ctx.fillStyle = '#1b1612'; ctx.beginPath(); ctx.arc(cx - 15, cy - 4, 6, 0, 7); ctx.arc(cx + 15, cy - 4, 6, 0, 7); ctx.fill();

  ctx.fillStyle = '#2a1f14'; ctx.font = `10px ${FONT_D}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`УБЕЖИЩЕ ${S.vault}`, sx + 2, sy - 49);

function drawOutside(t) {

function drawBadge(x, y, what, col) {

// ===== Комнаты =====
function drawRoom(r, x, y, w, t) {
  const def = ROOMS[r.t];
  ctx.fillStyle = '#16120e';
  ctx.fillRect(x, y, w, FH);
  const ix = x + 2, iy = y + 3, iw = w - 4, ih = FH - 6;
  if (r.t === 'elev') { drawElevator(r, ix, iy, iw, ih, t); return; }
  const col = r.t === 'door' ? '#3b4147' : def.col;
  ctx.fillStyle = col;
  ctx.fillRect(ix, iy, iw, ih);
  // панели стены
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let px = ix + 18; px < ix + iw; px += 30) ctx.fillRect(px, iy + 6, 2, ih - 14);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.fillRect(ix, iy + ih * 0.55, iw, 2);
  // потолок и пол
  ctx.fillStyle = '#26221d'; ctx.fillRect(ix, iy, iw, 5);
  ctx.fillStyle = '#2d2822'; ctx.fillRect(ix, iy + ih - 7, iw, 7);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(ix, iy + ih - 7, iw, 1);
  // лампы
  if (!r.off && Cam.z > 0.4) {
    for (let lx = ix + 20; lx < ix + iw - 8; lx += 40) {
      ctx.fillStyle = 'rgba(255,230,160,.10)';
      ctx.beginPath(); ctx.moveTo(lx - 4, iy + 5); ctx.lineTo(lx + 4, iy + 5); ctx.lineTo(lx + 16, iy + ih - 8); ctx.lineTo(lx - 16, iy + ih - 8); ctx.fill();
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(lx - 4, iy + 4, 8, 2);
    }
  }
  if (Cam.z > 0.35) drawInterior(r, ix, iy, iw, ih, t);
  // разделители объединённых комнат
  if (r.s > 1) { ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 1; i < r.s; i++) ctx.fillRect(ix + i * 3 * CW - 3, iy + 5, 2, ih - 12); }
  // прогресс
  if (def && (def.kind === 'prod' || def.kind === 'radio') && r.w.length && !r.rdy) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(ix + 4, iy + ih - 4, iw - 8, 2.5);
    ctx.fillStyle = def.kind === 'radio' ? '#c58af0' : RES_COL[def.res];
    ctx.fillRect(ix + 4, iy + ih - 4, (iw - 8) * clamp(r.p, 0, 1), 2.5);
  }
  if (def && def.kind === 'craft' && r.craft) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(ix + 4, iy + ih - 4, iw - 8, 2.5);
    ctx.fillStyle = '#7ed957'; ctx.fillRect(ix + 4, iy + ih - 4, (iw - 8) * clamp(r.craft.p, 0, 1), 2.5);
  }
  if (r.t === 'door') drawDoorGear(r, ix, iy, ih, t);
  // выключено
  if (r.off) { ctx.fillStyle = 'rgba(5,8,12,.62)'; ctx.fillRect(ix, iy, iw, ih); }
  // происшествие
  const inc = incAt(r.id);
  if (inc && !(inc.ext && r.t === 'door' && r.hp > 0)) {
    ctx.fillStyle = inc.k === 'fire' ? `rgba(255,110,30,${0.18 + 0.08 * Math.sin(t * 9)})` : `rgba(220,40,30,${0.12 + 0.08 * Math.sin(t * 5)})`;
    ctx.fillRect(ix, iy, iw, ih);
  }
  // табличка
  if (Cam.z > 0.62 && r.t !== 'door') {
    ctx.font = `bold 9px ${FONT_B}`;
    const name = def.n.toUpperCase();

    ctx.fillStyle = '#efe6cf'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(name, ix + 6, iy + 13.5);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < r.l ? '#f0b429' : 'rgba(255,255,255,.2)'; ctx.fillRect(ix + 9 + tw + i * 5, iy + 11, 3.5, 5); }
  }
}
function drawElevator(r, ix, iy, iw, ih, t) {

        const col = inc.k === 'ghoul' ? '#6a6a4a' : '#6a3326';
        const skin = inc.k === 'ghoul' ? '#9aa36a' : '#d8a07a';
        ctx.scale(face, 1);
        const lg = Math.sin(t * 8 + en.tg) * 2.5;
        ctx.fillStyle = '#2a2018'; ctx.fillRect(-4 + lg * 0.5, -10, 3, 10); ctx.fillRect(1 - lg * 0.5, -10, 3, 10);
        ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-5, -21, 10, 12, 2); ctx.fill();
        ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0.5, -26, 4.6, 0, 7); ctx.fill();
        if (inc.k === 'raider') { ctx.fillStyle = '#c33'; ctx.fillRect(-1, -33, 2, 5); ctx.fillStyle = '#1c1c1c'; ctx.fillRect(4, -20, 9, 2.5); }
        else { ctx.fillStyle = '#e8f080'; ctx.fillRect(2, -27, 1.5, 1.5); }
      }
    }
    ctx.restore();
    if (inc.k !== 'fire' && en.hp < en.m) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 8, fy - 40, 16, 2.5);
      ctx.fillStyle = '#ef5b42'; ctx.fillRect(x - 8, fy - 40, 16 * hpk, 2.5);
    }
  }
}

// ===== Роботы =====
function drawRobots(t) {
  for (const b of S.robots) {
    const y = SURF + b.f * FH + 28 + Math.sin(t * 3 + b.x) * 3;

    ctx.fillStyle = '#9aa3a8'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#6d777c'; ctx.fillRect(-9, -1, 18, 2);

    ctx.strokeStyle = '#6d777c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(-10, 10); ctx.moveTo(6, 5); ctx.lineTo(10, 10); ctx.stroke();
    ctx.restore();
