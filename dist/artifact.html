:root {
  color-scheme: dark;
  --bg: #0b0907;
  --scr: #04120a;
  --scr2: #072012;
  --ph: #9dffb2;        /* люминофор */
  --ph-hi: #d6ffe0;
  --ph-dim: #58b670;
  --ph-faint: rgba(157, 255, 178, .12);
  --ph-line: rgba(157, 255, 178, .28);
  --ph-glow: rgba(110, 255, 150, .55);
  --amber: #ffc24a;
  --red: #ff5f4a;
  --cyan: #7fe0ff;
  --ink: #f2ead6;
  --muted: #a9a594;
  --fd: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --fm: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body { font: 15px/1.35 var(--fm); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; fill: currentColor; flex: none; vertical-align: -0.2em; }
#app { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ===== загрузка ===== */
#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #0a2414, #020805 70%); }
.boot { font: 500 13px/1.9 var(--fm); color: var(--ph); text-shadow: 0 0 8px var(--ph-glow); letter-spacing: .04em; padding: 16px; }
.boot p { margin: 0; opacity: 0; animation: bootln .01s forwards; }
.boot p:nth-child(2) { animation-delay: .25s; } .boot p:nth-child(3) { animation-delay: .5s; } .boot p:nth-child(4) { animation-delay: .75s; }
.boot b { color: var(--ph-hi); }
.caret { animation: blink 1s steps(1) infinite; }
@keyframes bootln { to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }

/* ===== терминал (общая рамка) ===== */
.term {
  position: relative; padding: 9px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0) 40%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,.03) 1px 3px),
    linear-gradient(#55584f, #2a2c27);
  border-radius: 16px;
  box-shadow: 0 18px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.5), 0 0 0 1px #111;
}
.term-scr {
  position: relative; overflow: hidden; border-radius: 10px;
  background: radial-gradient(ellipse at 50% 0%, #0d3019 0%, var(--scr) 70%);
  color: var(--ph);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.9), inset 0 0 30px rgba(0,0,0,.85), inset 0 0 90px rgba(0,40,10,.6), 0 0 0 2px #0e0f0d;
  text-shadow: 0 0 6px rgba(120,255,150,.35);
}
.term-scr::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: inherit;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
}
.term-scr::before {
  content: ""; position: absolute; inset: -40% 0 auto 0; height: 40%; pointer-events: none; z-index: 6;
  background: linear-gradient(rgba(157,255,178,0), rgba(157,255,178,.05), rgba(157,255,178,0));
  animation: scan 7s linear infinite;
}
@keyframes scan { to { transform: translateY(420%); } }
.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; z-index: 2; background: radial-gradient(circle at 35% 35%, #d9dbd2, #6a6c64 60%, #2a2b27); box-shadow: 0 1px 1px rgba(0,0,0,.6); }
.screw::after { content: ""; position: absolute; left: 1.5px; right: 1.5px; top: 4px; height: 1px; background: rgba(0,0,0,.55); transform: rotate(35deg); }
.s1 { top: 2px; left: 12px; } .s2 { top: 2px; right: 12px; } .s3 { bottom: 1px; left: 12px; } .s4 { bottom: 1px; right: 12px; }

/* ===== кнопки терминала ===== */
.t-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 7px 14px;
  border: 1.5px solid var(--ph-dim); border-radius: 5px; background: rgba(157,255,178,.06);
  color: var(--ph-hi); font: 600 15px/1.05 var(--fd); letter-spacing: .06em; text-transform: uppercase; text-align: left;
  box-shadow: inset 0 0 12px rgba(157,255,178,.08); transition: background .12s, transform .08s;
}
.t-btn span { display: flex; flex-direction: column; gap: 2px; }
.t-btn small { font: 500 11.5px var(--fm); letter-spacing: 0; text-transform: none; opacity: .8; }
.t-btn:active:not([disabled]) { background: rgba(157,255,178,.22); transform: translateY(1px); }
.t-btn.pri { background: var(--ph); color: #031a0a; border-color: var(--ph-hi); text-shadow: none; box-shadow: 0 0 16px rgba(120,255,150,.45), inset 0 -2px 0 rgba(0,0,0,.2); }
.t-btn.pri .ic { color: #031a0a; }
.t-btn.warn { border-color: var(--amber); color: var(--amber); background: rgba(255,194,74,.08); text-shadow: 0 0 6px rgba(255,194,74,.35); }
.t-btn.danger { border-color: var(--red); color: var(--red); background: rgba(255,95,74,.08); text-shadow: 0 0 6px rgba(255,95,74,.35); }
.t-btn.q { border-color: var(--cyan); color: var(--cyan); background: rgba(127,224,255,.08); }
.t-btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.t-btn.wide { width: 100%; margin-block: 8px; justify-content: center; }
.t-btn[disabled] { opacity: .38; cursor: default; box-shadow: none; }
.t-row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.t-row-btns .t-btn { flex: 1 1 130px; }
.t-row-btns.col { flex-direction: column; }
.t-row-btns.col .t-btn { flex: none; justify-content: center; }
.link { color: var(--amber); text-decoration: underline; font: 500 13px var(--fm); }

/* ===== главное меню ===== */
#menu { position: absolute; inset: 0; z-index: 20; overflow-y: auto; display: flex; justify-content: center; padding: calc(var(--safe-t) + 7vh) 16px calc(var(--safe-b) + 20px); }
.menu-wrap { width: min(430px, 100%); display: flex; flex-direction: column; gap: 26px; }
.logo { position: relative; text-align: center; padding-top: 6px; }
.logo-gear { position: absolute; left: 50%; top: -18px; width: 190px; height: 190px; margin-left: -95px; color: rgba(255,194,74,.1); z-index: -1; animation: spin 60s linear infinite; }
.logo-gear .ic { width: 100%; height: 100%; }
@keyframes spin { to { transform: rotate(360deg); } }
.logo small { display: block; font: 500 11px var(--fm); letter-spacing: .38em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 10px rgba(255,194,74,.6); }
.logo h1 { margin: 10px 0 10px; font-family: var(--fd); font-weight: 700; text-transform: uppercase; line-height: .86; transform: skewX(-6deg); }
.logo .l1 { display: block; font-size: 30px; letter-spacing: .34em; margin-right: -.34em; color: #f6ecd2; text-shadow: 0 2px 0 #6a3a10, 0 4px 14px rgba(0,0,0,.8); }
.logo .l2 {
  display: block; font-size: 70px; letter-spacing: .015em;
  background: linear-gradient(180deg, #fff6d0 0%, #ffd35a 38%, #ff9f1c 62%, #c6490f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1.5px #3a1a06;
  filter: drop-shadow(0 3px 0 #5a2708) drop-shadow(0 6px 0 #2a1204) drop-shadow(0 12px 18px rgba(0,0,0,.7));
}
.logo p { margin: 0; font: 500 12.5px/1.5 var(--fm); color: #e9dfc4; text-shadow: 0 1px 3px #000; }
.menu-term .term-scr { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.term-title { font: 600 12px var(--fm); letter-spacing: .24em; color: var(--ph-dim); padding-bottom: 8px; border-bottom: 1px dashed var(--ph-line); margin-bottom: 4px; }
.mbtn { position: relative; z-index: 7; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1.5px solid var(--ph-line); border-radius: 5px; font: 600 19px var(--fd); text-transform: uppercase; letter-spacing: .08em; color: var(--ph-hi); background: rgba(157,255,178,.04); text-align: left; }
.mbtn::before { content: "▸"; color: var(--ph-dim); margin-right: -2px; }
.mbtn span { flex: 1; }
.mbtn small { font: 500 12px var(--fm); letter-spacing: 0; text-transform: none; color: var(--ph-dim); }
.mbtn:active, .mbtn:hover { background: var(--ph); color: #031a0a; text-shadow: none; }
.mbtn:active small, .mbtn:hover small, .mbtn:active::before, .mbtn:hover::before { color: #0a3a18; }
.mbtn.pri { border-color: var(--ph); box-shadow: 0 0 18px rgba(120,255,150,.25), inset 0 0 14px rgba(157,255,178,.12); }
.mbtn .ic { width: 18px; height: 18px; }

/* ===== HUD ===== */
#top { position: absolute; top: 0; left: 0; right: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: stretch; }
#top > * { pointer-events: auto; }
#hud {
  padding: calc(var(--safe-t) + 6px) 8px 8px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, rgba(0,0,0,.04) 1px 3px),
    linear-gradient(#3a3c36, #22241f 55%, #171815);
  box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 -1px 0 #000 inset, 0 3px 0 #0a0a09, 0 5px 0 rgba(255,194,74,.55), 0 8px 24px rgba(0,0,0,.6);
  display: flex; flex-direction: column; gap: 7px;
}
.hud-bar { display: flex; align-items: center; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px 0 4px; border-radius: 15px; background: linear-gradient(#11130f, #1c1e1a); box-shadow: inset 0 1px 3px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.1); font: 600 15px var(--fd); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: -3px; }
.p-ic { width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; flex: none; background: radial-gradient(circle at 35% 30%, var(--c2, #6a6c64), var(--c, #2a2b27)); box-shadow: 0 0 8px var(--g, transparent), inset 0 1px 1px rgba(255,255,255,.35); }
.p-ic .ic { width: 14px; height: 14px; color: #fff; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); }
.plate { margin-inline: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 5px; background: linear-gradient(#ffd766, #e8a41c); color: #2a1604; font: 700 16px var(--fd); letter-spacing: .12em; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.6); }
.plate small { font: 600 9px var(--fm); letter-spacing: .12em; opacity: .7; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gauge { display: flex; align-items: center; gap: 6px; min-width: 0; }
.gauge .p-ic { width: 26px; height: 26px; }
.gauge .p-ic .ic { width: 15px; height: 15px; }
.g-track { position: relative; flex: 1; height: 12px; border-radius: 6px; background: #0b0c0a; box-shadow: inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.1); overflow: hidden; min-width: 24px; }
.g-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(180deg, var(--c3), var(--c) 45%, var(--c4)); box-shadow: 0 0 10px var(--c); transition: width .35s; }
.g-track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.45) 9% 10%); }
.g-track::before { content: ""; position: absolute; left: 2px; right: 2px; top: 1px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 1; }
.gauge b { font: 600 13px var(--fd); min-width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }
.gauge.low .g-track { animation: lowp 1s infinite; }
.gauge.low b { color: var(--red); }
@keyframes lowp { 50% { box-shadow: inset 0 1px 3px rgba(0,0,0,.9), 0 0 0 1px var(--red), 0 0 10px var(--red); } }

/* ===== левая колонка уведомлений ===== */
#rail { position: absolute; left: 8px; top: calc(var(--hud-h, 90px) + 12px); z-index: 9; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; pointer-events: none; }
.rb { pointer-events: auto; position: relative; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px 0 4px; border-radius: 20px; background: linear-gradient(#262822, #151612); box-shadow: 0 4px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px #0b0b0a; font: 600 13.5px var(--fd); letter-spacing: .03em; color: var(--ink); white-space: nowrap; }
.rb .p-ic { width: 32px; height: 32px; }
.rb span.lb { max-width: 0; overflow: hidden; transition: max-width .3s; }
.rb.bad span.lb, .rb.wide span.lb { max-width: 160px; }
.rb:not(.bad):not(.wide) { padding: 0 4px; }
.rb .p-ic .ic { width: 18px; height: 18px; }
.rb .cnt { position: absolute; left: 24px; top: -3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font: 700 11px/18px var(--fd); text-align: center; box-shadow: 0 0 0 2px #151612; }
.rb.bad { animation: pulse 1s infinite; }
.rb.bad .p-ic { --c: #8a1a10; --c2: #ff5f4a; --g: rgba(255,80,60,.8); }
.rb.warn .p-ic { --c: #7a4a08; --c2: #ffc24a; --g: rgba(255,194,74,.6); }
.rb.good .p-ic { --c: #1a5a2a; --c2: #7dff95; --g: rgba(120,255,150,.5); }
.rb.lunch .p-ic { --c: #6a3a0a; --c2: #ffb03a; --g: rgba(255,176,58,.6); }
.rb.obj .p-ic { --c: #1f3e2a; --c2: #6ab883; }
.rb.icon-only { padding: 0 4px; }
.pulse { animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { transform: scale(1.05); filter: brightness(1.2); } }

#place { margin: 8px auto 0; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 10px; max-width: calc(100% - 20px); background: linear-gradient(#3a2c0e, #231a06); border: 1px solid var(--amber); box-shadow: 0 8px 22px rgba(0,0,0,.6), 0 0 18px rgba(255,194,74,.25); }
.pl-ic .ic { width: 26px; height: 26px; color: var(--amber); }
#place b { display: block; font: 600 16px var(--fd); color: var(--amber); letter-spacing: .04em; }
#place small { color: #e8d9b4; font-size: 12px; }
#place .t-btn { border-color: var(--amber); color: var(--amber); }

#toasts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 8px 10px 0 64px; pointer-events: none; }
.toast { max-width: min(440px, 100%); display: flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 8px; font: 500 12px/1.35 var(--fm); color: var(--ph); background: rgba(4,18,10,.92); border: 1px solid var(--ph-line); box-shadow: 0 6px 18px rgba(0,0,0,.55), 0 0 14px rgba(80,255,120,.08); text-shadow: 0 0 6px rgba(120,255,150,.35); animation: tin .25s ease-out; transition: opacity .4s, transform .4s; }
.toast::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex: none; }
.toast.bad { color: #ff8a78; border-color: rgba(255,95,74,.5); background: rgba(30,6,4,.92); text-shadow: 0 0 6px rgba(255,95,74,.4); }
.toast.warn { color: var(--amber); border-color: rgba(255,194,74,.45); background: rgba(28,20,4,.92); text-shadow: 0 0 6px rgba(255,194,74,.35); }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(.97); } }

#tut { position: absolute; left: 10px; right: 10px; bottom: calc(var(--safe-b) + 92px); z-index: 9; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; max-width: 560px; margin-inline: auto; background: rgba(4,18,10,.94); border: 1px solid var(--ph-line); box-shadow: 0 10px 26px rgba(0,0,0,.6), 0 0 22px rgba(80,255,120,.12); color: var(--ph); text-shadow: 0 0 6px rgba(120,255,150,.35); }
#tut p { margin: 0; flex: 1; font: 500 13px/1.45 var(--fm); }
.tut-ava { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #ffe07a, #e0961a); box-shadow: 0 0 12px rgba(255,194,74,.5); }
.tut-ava .ic { width: 28px; height: 28px; color: #3a2004; }

/* ===== док ===== */
#bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: space-around;
  padding: 6px 4px calc(var(--safe-b) + 7px);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, rgba(0,0,0,.04) 1px 3px),
    linear-gradient(#2b2d28, #151612);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 -3px 0 #0a0a09, 0 -5px 0 rgba(255,194,74,.5), 0 -10px 24px rgba(0,0,0,.5);
}
#bar button { flex: 1; max-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11.5px var(--fd); letter-spacing: .05em; text-transform: uppercase; color: #d9d4c2; }
#bar button i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 25%, #4a4d45, #1b1c19 70%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 3px rgba(0,0,0,.6), 0 0 0 2px #0c0c0b, 0 0 0 3px #45473f, 0 4px 8px rgba(0,0,0,.6); }
#bar button i .ic { width: 23px; height: 23px; color: var(--ph); filter: drop-shadow(0 0 5px rgba(120,255,150,.55)); }
#bar button:active i { transform: translateY(1px); filter: brightness(1.2); }
#bar .dock-main { transform: translateY(-12px); }
#bar .dock-main i { width: 64px; height: 64px; background: radial-gradient(circle at 35% 25%, #ffe28a, #f0a41a 55%, #a85a08); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 4px rgba(0,0,0,.35), 0 0 0 3px #1a1206, 0 0 0 5px #6a4a1a, 0 6px 16px rgba(0,0,0,.6), 0 0 24px rgba(255,180,50,.45); }
#bar .dock-main i .ic { width: 32px; height: 32px; color: #2a1604; filter: none; }
#bar .dock-main span { color: var(--amber); }
#bar .dock-main.pulse { animation: none; }
#bar .dock-main.pulse i { animation: glowp 1.2s infinite; }
@keyframes glowp { 50% { box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 0 0 3px #1a1206, 0 0 0 5px #ffd35a, 0 0 38px rgba(255,200,60,.9); } }

/* ===== лист-терминал ===== */
#sheet { position: absolute; left: 6px; right: 6px; bottom: calc(var(--safe-b) + 4px); z-index: 15; max-height: 64%; display: flex; animation: sheetin .24s cubic-bezier(.2,.9,.3,1.1); }
#sheet .term { flex: 1; display: flex; min-height: 0; }
#sheet .term-scr { flex: 1; display: flex; flex-direction: column; min-height: 0; }
@keyframes sheetin { from { transform: translateY(40px); opacity: .3; } }
.term-head { position: relative; z-index: 7; display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--ph-line); background: linear-gradient(rgba(157,255,178,.08), rgba(157,255,178,0)); }
.term-head h2 { flex: 1; margin: 0; font: 600 18px var(--fd); letter-spacing: .1em; text-transform: uppercase; color: var(--ph-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 10px var(--ph-glow); }
.t-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 6px; border: 1.5px solid var(--ph-line); color: var(--ph); }
.t-icon .ic { width: 20px; height: 20px; }
.t-icon:active { background: var(--ph-faint); }
#sheet-b { position: relative; z-index: 7; overflow-y: auto; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#sheet-b::-webkit-scrollbar { width: 6px; } #sheet-b::-webkit-scrollbar-thumb { background: var(--ph-line); border-radius: 3px; }
@media (min-width: 820px) {
  #sheet { left: auto; right: 12px; top: calc(var(--hud-h, 110px) + 12px); bottom: calc(var(--safe-b) + 12px); width: 440px; max-height: none; }
  #tut { left: 12px; right: auto; width: 440px; }
}

/* ===== элементы терминала ===== */
.muted { color: var(--ph-dim); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.good-t { color: var(--ph-hi); } .bad-t { color: var(--red) !important; text-shadow: 0 0 6px rgba(255,95,74,.4); } .warn-t { color: var(--amber); }
.t-h { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font: 600 13px var(--fd); letter-spacing: .16em; text-transform: uppercase; color: var(--ph-dim); }
.t-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--ph-line), transparent); }
.t-h small { font: 500 11.5px var(--fm); letter-spacing: 0; text-transform: none; }
.t-p { margin: 6px 0; font-size: 12.5px; line-height: 1.55; color: var(--ph); }
.empty-t { text-align: center; color: var(--ph-dim); padding: 22px 8px; font-size: 13px; }
.row-sp { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.grow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px var(--fd); letter-spacing: .03em; color: var(--ph-hi); }
.grow small { color: var(--ph-dim); font-size: 12px; }
.bar { display: block; height: 8px; border: 1px solid var(--ph-line); border-radius: 2px; background: rgba(0,0,0,.4); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bc, var(--ph)); box-shadow: 0 0 8px var(--bc, var(--ph-glow)); transition: width .4s; }
.bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.65) 7px 9px); }
.hpbar { display: block; height: 6px; border-radius: 1px; background: rgba(255,95,74,.18); position: relative; overflow: hidden; margin-top: 3px; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ph); box-shadow: 0 0 6px var(--ph-glow); }
.hpbar u { position: absolute; right: 0; top: 0; bottom: 0; background: var(--red); text-decoration: none; }
.hdr { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--ph-line); border-radius: 6px; background: linear-gradient(135deg, rgba(157,255,178,.08), rgba(157,255,178,0)); }
.hdr > div:first-child { flex: 1; }
.hdr p { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ph); }
.lvl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 600 13px var(--fd); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 8px rgba(255,194,74,.45); }
.pips { display: inline-flex; gap: 3px; } .pips i { width: 8px; height: 10px; border: 1px solid var(--amber); } .pips i.on { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.need { display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border: 1.5px solid var(--ph-dim); border-radius: 5px; min-width: 62px; }
.need em { font: 700 22px var(--fd); font-style: normal; color: var(--ph-hi); letter-spacing: .04em; }
.need small { font-size: 10.5px; color: var(--ph-dim); }
.status { margin-top: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border: 1px dashed var(--ph-line); border-radius: 6px; font-size: 13px; }
.status.col { flex-direction: column; align-items: stretch; gap: 7px; }
.status > span { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.status b { color: var(--ph-hi); }
.banner { margin-top: 10px; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 6px; font-size: 12.5px; line-height: 1.45; }
.banner .ic { width: 22px; height: 22px; }
.banner.bad { color: #ffb0a4; border: 1px solid var(--red); background: rgba(255,95,74,.1); text-shadow: 0 0 6px rgba(255,95,74,.35); }
.banner.warn { color: var(--amber); border: 1px solid rgba(255,194,74,.6); background: rgba(255,194,74,.07); text-shadow: 0 0 6px rgba(255,194,74,.3); }
.mono { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ph-hi); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border: 1px solid var(--ph-line); border-radius: 6px; background: rgba(157,255,178,.03); min-height: 122px; text-align: center; }
.slot:active { background: var(--ph-faint); }
.slot .nm { font: 600 14px var(--fd); letter-spacing: .03em; color: var(--ph-hi); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .hpbar, .slot .bar { width: 76%; }
.slot.empty { border-style: dashed; color: var(--ph-dim); justify-content: center; }
.slot .plus { font: 400 34px/1 var(--fd); color: var(--ph); text-shadow: 0 0 10px var(--ph-glow); }
.big { display: flex; flex-direction: column; align-items: center; min-width: 46px; font: 700 21px/1 var(--fd); color: var(--ph-hi); }
.big em { font: 500 10px var(--fm); color: var(--ph-dim); font-style: normal; letter-spacing: .06em; margin-bottom: 2px; }
.up .ic { color: var(--ph-hi); }
.ava { position: relative; width: 44px; height: 44px; border-radius: 7px; overflow: hidden; flex: none; border: 1px solid var(--ph-line); background: #08130c; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4); }
.ava img { display: block; width: 100%; height: 100%; }
.ava::after { content: ''; position: absolute; inset: 0; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 10px rgba(0,0,0,.5); pointer-events: none; }
.ava.leg { border-color: var(--amber); box-shadow: 0 0 8px rgba(255,194,74,.5); }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px dashed var(--ph-line); text-align: left; width: 100%; }
button.row:active, .row.sel { background: var(--ph); color: #031a0a; text-shadow: none; }
button.row:active *, .row.sel * { color: #031a0a !important; }
.row.dead { opacity: .6; }
.row[disabled] { opacity: .35; }
.row > .ic { width: 26px; height: 26px; color: var(--ph); }
.ic.r1 { color: var(--cyan); } .ic.r2 { color: var(--amber); }
.r1-t { color: var(--cyan) !important; text-shadow: 0 0 6px rgba(127,224,255,.4); } .r2-t { color: var(--amber) !important; text-shadow: 0 0 8px rgba(255,194,74,.5); }
.seg { display: flex; gap: 0; overflow-x: auto; margin-bottom: 8px; border: 1.5px solid var(--ph-dim); border-radius: 5px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; padding: 7px 10px; font: 600 12.5px var(--fd); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--ph); border-right: 1px solid var(--ph-line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ph); color: #031a0a; text-shadow: none; }
.seg.small button { padding: 5px 8px; font-size: 11.5px; }

/* житель */
.dw-head { display: flex; gap: 12px; align-items: stretch; }
.portrait { width: 106px; height: 132px; flex: none; border-radius: 6px; border: 1px solid var(--ph-line); box-shadow: inset 0 0 20px rgba(0,0,0,.8); }
.dw-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.kv { display: grid; grid-template-columns: 66px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.kv > span:first-child { color: var(--ph-dim); text-transform: uppercase; font-size: 10.5px; letter-spacing: .08em; }
.kv .hpbar { margin: 0; height: 8px; }
.spl { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
.sp { display: grid; grid-template-columns: 22px 108px 1fr 30px; gap: 8px; align-items: center; font-size: 12.5px; }
.sp > b { font: 700 16px var(--fd); color: var(--ph-hi); text-align: center; }
.sp > span { color: var(--ph); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.sp > em { font: 700 16px var(--fd); font-style: normal; color: var(--ph-hi); text-align: right; }
.sp > em small { font: 500 10px var(--fm); color: var(--amber); }
.sp .bar { height: 10px; }
.sp.hl > span, .sp.hl > b { color: var(--amber); }
.eqs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

const Snd = {
  ctx: null, on: true, master: null, paused: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !this.paused) this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;

      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  pause(p) {
    this.paused = p;
    if (!this.ctx) return;
    try { p ? this.ctx.suspend() : this.ctx.resume(); } catch (e) {}
  },
  tone(f, dur, type = 'square', vol = 0.08, slide = 0, delay = 0) {
    if (!this.on || !this.ctx || this.paused) return;
    try {
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },
  click() { this.tone(520, 0.05, 'square', 0.04); },
  collect() { this.tone(660, 0.07, 'triangle', 0.1); this.tone(990, 0.09, 'triangle', 0.08, 0, 0.06); },
  coin() { this.tone(1200, 0.05, 'square', 0.05); this.tone(1600, 0.08, 'square', 0.05, 0, 0.05); },
  build() { this.noise(0.18, 0.12, 700); this.tone(140, 0.12, 'sawtooth', 0.06); this.tone(220, 0.1, 'square', 0.05, 0, 0.12); this.tone(330, 0.18, 'triangle', 0.07, 0, 0.24); },
  level() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.09, 0, i * 0.08)); },
  alarm() { for (let i = 0; i < 3; i++) this.tone(480, 0.35, 'sawtooth', 0.06, 380, i * 0.4); },
  bad() { this.tone(200, 0.2, 'square', 0.06, -80); },
  open() { this.tone(300, 0.08, 'triangle', 0.08, 300); },
  shot(beam) {
    if (!this.on || !this.ctx || this.paused) return;
    const n = performance.now();
    if (n - (this._shotT || 0) < 70) return;

    if (beam) this.tone(1400, 0.08, 'sawtooth', 0.025, -900);

  noise(dur, vol, freq) {
    if (!this.on || !this.ctx || this.paused) return;
    try {
      const t = this.ctx.currentTime;
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const ch = buf.getChannelData(0);

    } catch (e) {}
  },
  stranger() { [392, 523, 659, 784, 659, 523].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, 0, i * 0.14)); },
  door() { this.noise(0.35, 0.07, 260); this.tone(62, 0.7, 'sawtooth', 0.035, -18); this.tone(110, 0.12, 'square', 0.03, -40, 0.05); this.noise(0.5, 0.025, 3000); },

// ===== Производство =====

// ===== Энергия =====

  for (const r of gens) { r.off = false; if (r.w.length) { const ct = cycleTime(r); if (ct !== Infinity) budget += roomOutput(r) / ct; } }
  const cons = S.rooms.filter(consumes);
  const dist = r => {
    let m = 1e9;
    for (const g of gens) m = Math.min(m, Math.abs(g.f - r.f) * 4 + Math.abs(g.c - r.c) / 3);

  cons.sort((a, b) => dist(a) - dist(b));

// ===== Главный цикл симуляции =====

// ===== Жители: движение, здоровье, дети =====
function incAt(roomId) { for (const i of S.incs) if (i.room === roomId) return i; return null; }
function dwellerRoom(d) { return d.room ? RM(d.room) : door(); }
function dwellerWorldPos(d) {

}
function updateDweller(d, dt) {

function idleMove(d, dt, r, inc) {
  if (!r) return;

    } else if (fightable) {

  else if (fightable && !d.child) {

function giveBirth(m) {

// ===== Знакомства в жилых помещениях =====
function updatePairs(dt) {
  for (const r of S.rooms) {
    if (r.t !== 'living') continue;
    const p = r.pair;
    if (!p) continue;
    const m = D(p.m), f = D(p.f);
    if (!m || !f || m.room !== r.id || f.room !== r.id || !arrived(m) || !arrived(f) || incAt(r.id)) { r.pair = null; if (m) m.hide = false; if (f) f.hide = false; continue; }
    p.t += dt;
    const talk = Math.max(5, 14 - (stat(m, 3) + stat(f, 3)) * 0.35);
    if (p.ph === 0 && p.t > talk) { p.ph = 1; p.t = 0; }
    else if (p.ph === 1 && p.t > 5) {
      if (popCount() + pregnancies() >= popCap()) { r.pair = null; m.cd = f.cd = S.time + 60; continue; }
      p.ph = 2; p.t = 0;
    } else if (p.ph === 2 && p.t > 4) {
      m.hide = f.hide = false;
      f.preg = 120; f.father = m.id;
      m.cd = S.time + 60; f.cd = S.time + 60;
      m.hap = Math.min(100, m.hap + 15); f.hap = Math.min(100, f.hap + 15);
      r.pair = null;

}
function tryPairing(r) {

  const ws = workersOf(r).filter(d => arrived(d) && !d.child && !d.preg && S.time >= (d.cd || 0));
  const ms = ws.filter(d => d.g === 'm'), fs = ws.filter(d => d.g === 'f');
  for (const m of ms) for (const f of fs) {
    if (related(m, f)) continue;
    const ch = 0.06 * (1 + (stat(m, 3) + stat(f, 3)) * 0.05);

  }
}

// ===== Медицина =====

// ===== Прибытие новых жителей =====
function spawnArrival(rar) {

}

// ===== Происшествия =====
function threat() {
  let n = 0, l = 0;
  for (const d of S.dwellers) if (d.st === 'vault' && !d.child) { n++; l += d.lvl; }
  const avg = n ? l / n : 1;
  return 1 + (avg - 1) * 0.07 + Math.max(0, popCount() - 10) * 0.012;
}
function makeEnemies(k, r, n, outside) {
  const e = ENEMY[k], th = threat();
  const w = roomW(r) * CW;
  const arr = [];
  for (let i = 0; i < n; i++) arr.push({ hp: e.hp * th, m: e.hp * th, x: outside ? PORTAL.x0 - rf(10, 110) : rf(16, w - 16), ph: rnd() * 6, tg: i, face: -1 });

}
function startIncident(k, r, silent, gen) {

  const inc = { id: uid(), k, room: r.id, en: makeEnemies(k, r, n, !!e.ext), t: 0, ext: !!e.ext, path: null, pi: -1, stolen: 0, gen: gen || 0 };
  S.incs.push(inc);

    R.flash = 1.2;
  }

}
function startRaid(k) {

}
function defenders(r) {
  const out = [];
  for (const d of S.dwellers) {
    if (d.st !== 'vault' || d.child || d.preg || d.hide || (d.path && d.path.length)) continue;
    if (d.room === r.id || (r.t === 'door' && !d.room)) out.push(d);
  }

}
function hurt(d, dmg, rad) {

  if (rad) d.rad = Math.min(d.mhp - 1, d.rad + rad);
  if (d.hp > effMax(d)) d.hp = effMax(d);
  d.hurt = 0.25;
  if (d.hp <= 0) dieDweller(d, 'vault');
}
function updateIncidents(dt) {
  for (let i = S.incs.length - 1; i >= 0; i--) {
    const inc = S.incs[i];
    const r = RM(inc.room);
    if (!r) { S.incs.splice(i, 1); continue; }
    const e = ENEMY[inc.k];
    const th = threat();
    const dpsMul = 0.7 + 0.3 * th;
    inc.t += dt;
    const defs = defenders(r);
    const alive = inc.en.filter(x => x.hp > 0);
    const breach = inc.ext && r.t === 'door' && r.hp > 0;
    const x0 = roomX(r), fy = roomY(r) + FEET;
    // жители атакуют
    for (const d of defs) {
      if (!alive.length) break;
      const tgt = alive[d.id % alive.length];
      const dmg = inc.k === 'fire' ? (1.5 + 0.05 * d.lvl + stat(d, 2) * 0.05) : dwellerDps(d);
      tgt.hp -= dmg * dt;
      d.fight = 0.3;
      d.fireCd = (d.fireCd || 0) - dt;
      if (d.fireCd <= 0 && !R.offline && inc.k !== 'fire') {
        d.fireCd = 0.28 + rnd() * 0.35;
        const wk = d.weapon ? WEAPONS[d.weapon.id] : null;
        const tx = breach ? tgt.x : x0 + tgt.x;
        if (wk && !['bat', 'knife'].includes(wk[4])) {
          d.fireT = 0.07;
          tracer(d.x + (d.face || 1) * 15, SURF + d.fy * FH + FEET - 23, tx + rf(-3, 3), fy - (inc.k === 'beast' ? 30 : inc.k === 'roach' ? 4 : 20) + rf(-3, 3), wk[5] || '#ffe08a');
          Snd.shot(wk[5]);
        }
        if (rnd() < 0.5) R.parts.push({ x: tx + rf(-4, 4), y: fy - rf(6, 24), vx: rf(-40, 40), vy: rf(-60, -10), t: 0, life: 0.3, col: '#ffd070', s: 1.2, ember: true });
      }
      if (tgt.hp <= 0) {
        S.stats.kills++;
        if (inc.k !== 'fire') objProg('kill', 1);
        for (const x of defs) gainXp(x, 4);
        alive.splice(alive.indexOf(tgt), 1);
        if (!R.offline) sparks(breach ? tgt.x : x0 + tgt.x, fy - 10, inc.k === 'fire' ? '#bcd8ff' : '#c8302a', 14);
      }
    }
    if (inc.k === 'fire' && !defs.length) {
      for (const x of alive) x.hp -= 0.5 * dt;
      for (let j = alive.length - 1; j >= 0; j--) if (alive[j].hp <= 0) alive.splice(j, 1);
    }
    // враги атакуют
    if (breach) {
      let dps = 0;
      for (const x of alive) dps += e.dps * dpsMul;
      r.hp = Math.max(0, r.hp - dps * dt);
      if (r.hp <= 0 && !R.offline) { toast(`${e.n} выломали дверь!`, 'bad'); Snd.alarm(); for (const x of alive) x.x = rf(80, 150); }
    } else if (defs.length) {
      if (inc.k === 'fire') {
        for (const d of defs) hurt(d, e.dps * dpsMul * alive.length * dt * 0.6);
      } else {
        for (const x of alive) {
          const d = defs[x.tg % defs.length];
          if (!d || d.st !== 'vault') continue;
          hurt(d, e.dps * dpsMul * dt, e.rad ? e.rad * dt : 0);
          x.face = Math.sign(d.x - (x0 + x.x)) || x.face;
        }
      }
    }
    // исход
    if (!alive.length) {
      S.incs.splice(i, 1);
      const reward = defs.length ? Math.round(e.reward * (inc.ext ? inc.en.length : Math.max(1, r.s)) * (0.8 + th * 0.2)) : 0;
      addCaps(reward);
      if (inc.k === 'fire') objProg('fire', 1);
      for (const d of defs) gainXp(d, 15);
      if (inc.ext) door().hp = DOOR_HP[door().l - 1];
      if (!R.offline) {
        if (reward) {
          toast(`${e.n} — угроза устранена! +${reward} крышек`, 'good');
          floatText(roomX(r) + roomW(r) * CW / 2, roomY(r) + 20, `+${reward}`, RES_COL.caps, 'caps');
          Snd.coin();
        } else toast(`${e.n}: огонь выгорел в «${roomName(r)}»`, 'warn');
      }
      continue;
    }
    if (inc.ext) {
      if (breach) {
        for (const x of alive) { x.ph += dt; x.x = clamp(x.x + Math.sin(x.ph * 2 + x.tg) * dt * 12, PORTAL.x0 - 120, PORTAL.x0 + 30); x.face = 1; }
        continue;
      }
      const stay = defs.length ? 22 : 6;
      if (inc.t >= stay) {
        if (!defs.length && e.steal) {
          const s = Math.min(600, Math.floor(S.res.caps * e.steal));
          S.res.caps -= s; inc.stolen += s;
        }
        let next = null;
        while (inc.path && ++inc.pi < inc.path.length) {
          const c = RM(inc.path[inc.pi]);
          if (c && !incAt(c.id)) { next = c; break; }
        }
        if (!next) {
          S.incs.splice(i, 1);
          door().hp = DOOR_HP[door().l - 1];
          if (!R.offline) toast(`${e.n} ушли${inc.stolen ? `, украв ${inc.stolen} крышек` : ''}`, 'warn');
          continue;
        }
        inc.room = next.id;
        inc.t = 0;
        const w = roomW(next) * CW;
        for (const x of inc.en) x.x = rf(14, Math.min(60, w - 14));
      }
    } else if (inc.k === 'scorp') {
      inc.tp = (inc.tp || 0) + dt;
      if (inc.tp > 16 && rnd() < dt * 0.35) {
        const cand = S.rooms.filter(c => ROOMS[c.t] && c !== r && !incAt(c.id));
        if (cand.length) {
          const n = pick(cand);
          inc.room = n.id; inc.tp = 0; inc.t = 0;
          for (const x of inc.en) x.x = rf(16, roomW(n) * CW - 16);
          if (!R.offline) { toast(`Радскорпион зарылся и вылез: ${roomName(n)}!`, 'bad'); sparks(roomX(n) + roomW(n) * CW / 2, roomY(n) + FEET, '#8a6a4a', 30); }
        }
      }
    } else {

          const nb = neighbors(r).filter(n => n.t !== 'elev' && n.t !== 'door' && !incAt(n.id));
          if (nb.length) {
            const n = pick(nb);

          }

      }
    }
    // перемещение врагов
    const w = roomW(r) * CW;
    for (const x of alive) {
      x.ph += dt;
      if (inc.k !== 'fire') {
        const nx = clamp(x.x + Math.sin(x.ph * 1.3 + x.tg) * dt * (inc.k === 'roach' ? 40 : 22), 12, w - 12);

// ===== Пустошь =====
function sendExplore(d, stims, rads) {

    }

  }

  d.rad = Math.min(d.mhp - 1, d.rad + dt * 0.03 * (1 - clamp(stat(d, 2), 0, 15) * 0.05));
  if (d.hp > effMax(d)) d.hp = effMax(d);

function wasteEvent(d) {

  const kind = weighted([['caps', 26 + L], ['junk', 16 + P], ['item', 9 + P * 0.6 + L * 0.4], ['fight', 15 + lv * 1.2], ['friend', 6 + C], ['loc', 8 + I], ['none', 8]]);
  if (kind === 'caps') {

  } else if (kind === 'junk') {

    const ids = Object.keys(JUNK).filter(j => JUNK[j][1] === rar);
    const j = pick(ids);
    const n = ri(1, 2);
    ex.junk[j] = (ex.junk[j] || 0) + n;
    exLog(d, `Подобрал(а) хлам: ${JUNK[j][0]} ×${n} ${place}.`);
  } else if (kind === 'item') {
    if (ex.items.length >= packCap(d)) { exLog(d, 'Рюкзак полон — пришлось оставить находку.'); return; }
    const it = randomItem(rollRarity(L, ex.t / 8000));

    exLog(d, `${['Нашёл(ла)', 'Отыскал(а) редкую вещь:', 'ЛЕГЕНДАРНАЯ находка:'][itemRar(it)]} ${itemName(it)}!`);
  } else if (kind === 'fight') {

    let dmg = 0.45 * e.dps * (0.8 + lv * 0.08) * Math.min(tkill, 8 + lv * 2) * (1 - clamp(stat(d, 2), 0, 17) * 0.03) * (1 - clamp(stat(d, 5), 0, 17) * 0.02);
    dmg = Math.max(1, Math.round(dmg));

    if (d.hp <= 0) {
      d.hp = 0;
      exLog(d, `Погиб(ла) в схватке: ${e.n}.`);
      d.st = 'dead';
      d.deadIn = 'waste';
      if (!R.offline) { toast(`${fullName(d)} погиб(ла) в Пустоши`, 'bad'); Snd.bad(); }

    ex.xp += xp;

    if (rnd() < 0.35) { const n = ri(5, 20); ex.caps += n; msg += ` +${n} крышек.`; }

  } else if (kind === 'friend') {
    const r = rnd();
    if (r < 0.4) { const n = Math.round(ri(10, 30) * (1 + C * 0.1)); ex.caps += n; exLog(d, `Встретил(а) торговца и выгодно сторговался(ась): +${n} крышек.`); }

function collectExplorer(d) {

  let sold = 0;

  for (const j in ex.junk) S.junk[j] = Math.min(99, (S.junk[j] || 0) + ex.junk[j]);
  S.res.stim = Math.min(Math.max(resCap('stim'), S.res.stim), S.res.stim + ex.stim);

// ===== Задания смотрителя =====
function avgLevel() {
  const a = S.dwellers.filter(d => !d.child && d.st !== 'dead');
  return a.length ? a.reduce((s, d) => s + d.lvl, 0) / a.length : 1;
}
function questSlots() { const o = S.rooms.find(r => r.t === 'overseer'); return o ? o.l : 0; }
function questsRunning() { return S.quests.active.filter(q => q.stage !== 'done').length; }
function refreshQuests() {
  const used = new Set(S.quests.active.map(q => q.n));
  const al = avgLevel();
  const list = [];
  const pool = QUESTS.filter(q => !used.has(q[0]));
  for (let i = 0; i < 3 && pool.length; i++) {
    const q = pool.splice(ri(0, pool.length - 1), 1)[0];
    const lvl = Math.max(1, Math.round(al + i * 2 + rf(-1, 2)));
    const rar = i === 2 ? 1 : 0;
    list.push({
      id: uid(), n: q[0], desc: q[1], mx: q[2], my: q[3], lvl, dur: ri(50, 90) + i * 30, diff: 30 + lvl * 22 + i * 25,
      rw: { caps: Math.round((120 + lvl * 40) * (1 + i * 0.4)), item: rar + (rnd() < 0.1 ? 1 : 0), lunch: rnd() < 0.2 + i * 0.1 ? 1 : 0, quantum: rnd() < 0.2 ? ri(1, 3) : 0, pet: rnd() < 0.08 + i * 0.05 ? 1 : 0 },
    });
  }
  S.quests.list = list;
  S.quests.refresh = S.time + 600;
}
function teamPower(team) {
  let p = 0;
  for (const d of team) p += dwellerDps(d) * 6 + d.lvl * 4 + effMax(d) * 0.15 + stat(d, 0) + stat(d, 2) + stat(d, 5);
  return p;
}
function startQuest(q, ids) {
  if (questsRunning() >= questSlots()) { toast(`Одновременно отрядов: ${questSlots()}. Улучшите Кабинет смотрителя`, 'warn'); return false; }
  const team = ids.map(D).filter(d => d && d.st === 'vault' && !d.child);
  if (!team.length) return false;
  for (const d of team) { d.prev = d.room; unassign(d); d.st = 'quest'; walkOut(d); }
  S.quests.list = S.quests.list.filter(x => x !== q);
  q.team = team.map(d => d.id);
  q.stage = 'go';
  q.left = q.dur;

  Snd.open();
  return true;
}

  for (const q of S.quests.active) {
    if (q.stage === 'done') continue;
    q.left -= dt;
    if (q.left > 0) continue;
    if (q.stage === 'go') {
      const team = q.team.map(D).filter(Boolean);
      q.ok = rnd() < q.chance;
      for (const d of team) {
        const loss = (q.ok ? rf(0.1, 0.4) : rf(0.5, 0.8)) * d.mhp;
        d.hp = Math.max(1, d.hp - loss);
      }
      q.stage = 'back';
      q.left = q.dur / 2;
    } else if (q.stage === 'back') {
      q.stage = 'done';
      if (!R.offline) { toast(`Отряд вернулся: «${q.n}» — ${q.ok ? 'успех!' : 'провал'}`, q.ok ? 'good' : 'bad'); Snd.open(); }
    }
  }
}
function collectQuest(q) {
  const team = q.team.map(D).filter(Boolean);
  const xp = q.ok ? 60 + q.lvl * 15 : 20;
  for (const d of team) { gainXp(d, xp); d.st = 'vault'; d.room = null; d.x = PORTAL.x0 - 20; d.fy = 0; d.path = null; autoAssign(d, d.prev); }
  const got = [];
  if (q.ok) {
    addCaps(q.rw.caps); got.push(`${q.rw.caps} крышек`);
    const it = randomItem(Math.min(2, q.rw.item));
    addItem(it); got.push(itemName(it));
    if (q.rw.lunch) { S.lunch += q.rw.lunch; got.push('ящик снабжения'); }
    if (q.rw.quantum) { S.res.quantum += q.rw.quantum; got.push(`${q.rw.quantum} Атом-колы`); }
    if (q.rw.pet) { const p = genPet(rollRarity(3)); S.pets.push(p); got.push('питомец ' + p.name); }

  }
  S.quests.active.splice(S.quests.active.indexOf(q), 1);
  toast(q.ok ? `Награда: ${got.join(', ')}` : 'Отряд вернулся ни с чем, но набрался опыта', q.ok ? 'good' : 'warn');
  Snd.coin();
}

// ===== Цели =====
function objNeed(n) {
  if (!n) return true;
  if (n === 'living') return hasType('living');
  if (n === 'overseer') return hasType('overseer');
  if (n === 'pet') return S.pets.length > 0;
  return hasKind(n);
}
function addObjective() {
  const avail = OBJ_T.filter(o => !S.objs.some(x => x.k === o.k) && objNeed(o.need));
  const o = pick(avail);
  const tier = Math.floor(S.objN / 3);
  const n = o.b + o.g * tier;
  let rw;
  if (S.objN % 4 === 3) rw = { lunch: 1 };
  else if (rnd() < 0.15) rw = { quantum: ri(1, 3) };
  else rw = { caps: 50 + 25 * tier + ri(0, 5) * 10 };
  S.objs.push({ k: o.k, t: o.t.replace('{n}', fmt(n)), n, p: 0, rw });

}
function objProg(k, n) {

    o.p = Math.min(o.n, o.p + n);
    if (o.p >= o.n && !R.offline) { toast(`Цель выполнена: ${o.t}`, 'good'); Snd.coin(); }
  }
}
function claimObjective(i) {

  if (o.rw.caps) addCaps(o.rw.caps);
  if (o.rw.quantum) S.res.quantum += o.rw.quantum;
  if (o.rw.lunch) S.lunch += o.rw.lunch;

  addObjective();

}
function rewardText(rw) {

  if (rw.quantum) return `${rw.quantum} Атом-колы`;

}

// ===== Ящики снабжения =====
function openLunchbox() {
  if (S.lunch < 1) return null;
  S.lunch--;
  const cards = [];
  for (let i = 0; i < 4; i++) {
    const t = weighted([['caps', 27], ['res', 21], ['w', 16], ['o', 16], ['junk', 9], ['dw', 5], ['pet', 3.5], ['q', 3], ['robot', 1.2]]);
    cards.push(makeCard(t));
  }
  if (!cards.some(c => c.rar >= 1)) cards[3] = makeCard(rnd() < 0.5 ? 'w' : 'o', 1);
  for (const c of cards) c.apply();
  return cards;
}
function makeCard(t, forceRar) {

  }

  }

  }
  if (t === 'junk') {
    const js = {};

    return { t, rar: 0, icon: 'junk', col: '#c9b27a', title: 'Хлам', sub: Object.keys(js).map(j => `${JUNK[j][0]} ×${js[j]}`).join(', '), apply: () => { for (const j in js) S.junk[j] = Math.min(99, (S.junk[j] || 0) + js[j]); } };
  }

  }
  if (t === 'pet') {
    const p = genPet(rollRarity(3, 0.15));
    return { t, rar: p.rar, icon: 'paw', col: RAR_COL[p.rar], title: petName(p), sub: petDesc(p), apply: () => S.pets.push(p) };
  }

  }

  return { t: 'robot', rar: 2, icon: 'robot', col: RAR_COL[2], title: 'Робот-помощник', sub: 'Сам собирает ресурсы на своём этаже', apply: () => S.robots.push({ f: 0, x: 200, dir: 1, cd: 0 }) };
}

// ===== Роботы-помощники =====
function updateRobots(dt) {
  for (const b of S.robots) {
    const rooms = S.rooms.filter(r => r.f === b.f && r.t !== 'elev');
    if (!rooms.length) { b.f = 0; continue; }
    const minX = Math.min(...rooms.map(r => roomX(r))) + 20, maxX = Math.max(...rooms.map(r => roomX(r) + roomW(r) * CW)) - 20;
    b.x += b.dir * 30 * dt;
    if (b.x > maxX) { b.x = maxX; b.dir = -1; }
    if (b.x < minX) { b.x = minX; b.dir = 1; }
    b.cd -= dt;
    if (b.cd <= 0) {
      b.cd = 3;
      for (const r of rooms) if ((r.rdy || r.done) && b.x >= roomX(r) && b.x <= roomX(r) + roomW(r) * CW) collectRoom(r, true);
    }
  }
}

// ===== Таинственный незнакомец =====
function spawnStranger() {

}

  const s = R.stranger;

  const r = RM(s.room);

  if (r) { floatText(roomX(r) + s.x, roomY(r) + 20, `+${caps}`, RES_COL.caps, 'caps'); sparks(roomX(r) + s.x, roomY(r) + 40, '#ffc24a', 30); }

// ===== Медленный тик (1 раз в секунду) =====
function slowTick() {
  updatePower();
  let radio = 0;
  for (const r of S.rooms) if (r.t === 'radio' && r.w.length && !r.off) radio += 4 + r.l * 2;
  radio = Math.min(20, radio);
  for (const d of S.dwellers) {
    if (d.st !== 'vault') continue;
    let t;
    if (d.child) t = 85;
    else {
      t = 50;
      const r = d.room ? RM(d.room) : null;
      if (!r) t -= 15;
      else {
        const def = ROOMS[r.t];
        if (def && def.st >= 0) { const v = stat(d, def.st), b = stat(d, bestStat(d)); t += 10 + 25 * (v / Math.max(1, b)); if (def.kind === 'train') t += 5; }
        else if (r.t === 'door') t += 20;
        if (r.off) t -= 15;
        if (incAt(r.id)) t -= 10;
      }
      if (d.preg) t += 10;
      if (d.pet) t += 5;
    }
    if (S.res.food <= 0) t -= 25;
    if (S.res.water <= 0) t -= 25;
    if (d.hp < effMax(d) * 0.5) t -= 10;
    if (d.rad > d.mhp * 0.3) t -= 10;
    t = clamp(t + radio, 5, 100);
    d.hap += (t - d.hap) * 0.012;
  }
  for (const r of S.rooms) if (r.t === 'living') tryPairing(r);
  const pop = popCount();
  S.timers.arrive -= 1;
  if (S.timers.arrive <= 0) {
    if (pop < 40 && S.arrivals.length < 4 && pop + S.arrivals.length < popCap() + 2) {
      spawnArrival(rnd() < 0.08 ? 1 : 0);
      if (!R.offline) toast('У двери новый выживший', 'good');
    }
    S.timers.arrive = pop < 20 ? ri(60, 120) : ri(200, 360);
  }
  if (!R.offline) {
    if (!R.say && rnd() < 0.14) {
      const cand = S.dwellers.filter(d => d.st === 'vault' && !d.child && !d.path && !d.hide);
      if (cand.length) R.say = { id: pick(cand).id, text: pick(SAY), t: 3.2 };
    }
    S.timers.stranger = (S.timers.stranger == null ? ri(150, 300) : S.timers.stranger) - 1;
    if (S.timers.stranger <= 0) { S.timers.stranger = ri(240, 540); if (S.tutDone && !R.stranger) spawnStranger(); }
  }
  if (S.tutDone && !R.offline) {
    S.timers.inc -= 1;
    if (S.timers.inc <= 0) {
      S.timers.inc = ri(240, 480);
      const cand = S.rooms.filter(r => ROOMS[r.t] && r.w.length && !incAt(r.id));
      if (cand.length && pop >= 6) {
        let k = pick(['fire', 'roach']);
        if (pop >= 30 && rnd() < 0.3) k = 'molerat';
        if (pop >= 50 && rnd() < 0.15) k = 'scorp';
        startIncident(k, pick(cand));
      }
    }
    S.timers.raid -= 1;
    if (S.timers.raid <= 0) {
      S.timers.raid = ri(360, 660);
      if (pop >= 6 && !S.incs.some(i => i.ext)) {
        let k = 'raider';
        if (pop >= 35 && rnd() < 0.35) k = 'ghoul';
        if (pop >= 60 && rnd() < 0.3) k = 'beast';
        startRaid(k);
      }
    }
  }
  if (!S.tutDone) {
    if (S.tut === 0 && S.dwellers.length > 0) S.tut = 1;
    if (S.tut === 1 && S.rooms.some(r => ROOMS[r.t] && ROOMS[r.t].res === 'power')) S.tut = 2;
    if (S.tut === 2 && hasType('diner') && hasType('water')) S.tut = 3;
    if (S.tut === 3 && ['power', 'diner', 'water'].every(t => S.rooms.some(r => r.t === t && r.w.length))) S.tut = 4;
    if (S.tut === 5 && hasType('living')) { S.tut = 6; S.tutT = 14; }
    if (S.tut === 6) { S.tutT = (S.tutT || 14) - 1; if (S.tutT <= 0) S.tutDone = true; }
  }
}

// ===== Офлайн-прогресс =====
function simOffline(sec) {
  const before = { caps: S.res.caps, pop: popCount() };
  R.offline = true;
  for (let t = 0; t < sec; t += 1) sim(1);
  R.offline = false;
  R.offlineReport = { sec, caps: Math.round(S.res.caps - before.caps), births: popCount() - before.pop };
}

// ---- 07-chars.js ----
// ===== Жители: вырезная анимация (cut-out) с запечёнными атласами частей тела =====
// Каждая внешность (кожа, причёска, одежда, головной убор) один раз рисуется в атлас: туловище, голова,
// бедро/голень, плечо/предплечье (ближние и дальние), глаза и рты с разными эмоциями. В кадре части
// ставятся по суставам скелета. Контур рисуется отдельным проходом, поэтому силуэт цельный, без швов.
const INK_C = '#1c130e';
const CHR = { atl: new Map(), ow: 0.6, bakes: 0 };
const HIP_Y = -17.2, THIGH = 8.4, SHIN = 8.8, UARM = 7.0, FARM = 5.7;

// ---------- цвет ----------
function hexOf(r, g, b) { const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); return '#' + c(r) + c(g) + c(b); }
function cmix(a, b, t) { const x = rgb(a), y = rgb(b); return hexOf(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t); }
function cdk(a, k) { return cmix(a, '#1d1830', k); }      // тень — темнее и холоднее
function clt(a, k) { return cmix(a, '#fff6e2', k); }      // свет — светлее и теплее
function cmul(a, k) { const x = rgb(a); return hexOf(x[0] * k, x[1] * k, x[2] * k); }

// ---------- геометрия ----------
const _M = (dx, dy) => new DOMMatrix([1, 0, 0, 1, dx, dy]);
function _inv(p, dx, dy) { const q = new Path2D(); q.rect(-300, -300, 600, 600); q.addPath(p, _M(dx, dy)); return q; }
function P2(fn) { const p = new Path2D(); fn(p); return p; }
function limbPath(x0, y0, r0, x1, y1, r1, b = 0.3) {
  return P2(p => {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    p.moveTo(x0 + r0, y0);
    p.quadraticCurveTo(mx + (r0 + r1) / 2 + b, my, x1 + r1, y1);
    p.arc(x1, y1, r1, 0, Math.PI);
    p.quadraticCurveTo(mx - (r0 + r1) / 2 - b, my, x0 - r0, y0);
    p.arc(x0, y0, r0, Math.PI, Math.PI * 2);
    p.closePath();
  });
}
function ellP(x, y, rx, ry, rot = 0) { return P2(p => p.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2)); }

// Объёмная заливка: основной цвет, мягкий градиент сверху вниз, собственная тень снизу-сзади и блик сверху-спереди
function cel(g, p, base, o = {}) {
  const sp = o.sp || p;
  g.save(); g.clip(p);
  g.fillStyle = base; g.fill(p);
  if (o.y0 != null) {
    const gr = g.createLinearGradient(0, o.y0, 0, o.y1);
    gr.addColorStop(0, 'rgba(255,246,226,.12)'); gr.addColorStop(1, 'rgba(24,16,36,.2)');
    g.fillStyle = gr; g.fill(p);
  }
  const d = o.d ?? 1.2;
  if (d) { g.fillStyle = o.shc || cdk(base, 0.36); g.fill(_inv(sp, d * (o.sx ?? 0.55), -d), 'evenodd'); }
  const h = o.h ?? 0.55;
  if (h) { g.fillStyle = o.hic || clt(base, 0.3); g.fill(_inv(sp, -h * (o.hx ?? 0.45), h), 'evenodd'); }
  g.restore();
}
function lineC(g, col, w, fn) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); fn(g); g.stroke(); }

// ---------- костюмы ----------
function costume(L, P) {

  const C = { top: c1, sleeve: c1, cuff: null, pants: c1, boot: '#2b221c', sole: '#16110d', glove: null, trim: c2, belt: null, long: false, short: false, B: 1 };
  switch (s) {
    case 'vault': C.cuff = c2; C.belt = '#2a211b'; C.boot = '#2c241e'; break;
    case 'jump': C.cuff = c2; C.belt = '#3b2c20'; C.boot = '#3d2b1d'; break;
    case 'jacket': C.pants = '#374462'; C.boot = '#4d3322'; C.cuff = cdk(c1, 0.25); break;
    case 'formal': C.pants = cdk(c1, 0.12); C.boot = '#15151a'; C.cuff = '#eeeae0'; break;
    case 'coat': C.pants = '#4b505b'; C.boot = '#3d2c22'; C.long = true; break;
    case 'overall': C.top = c2; C.sleeve = c2; C.pants = c1; C.boot = '#5a3b22'; C.cuff = cdk(c2, 0.2); break;
    case 'shirt': C.pants = c2; C.boot = '#6d4a2e'; C.short = true; break;
    case 'uniform': C.belt = c2; C.boot = '#2a241e'; break;
    case 'armor': C.top = '#3d434a'; C.sleeve = '#3d434a'; C.pants = '#3b3f45'; C.boot = '#29251f'; C.belt = '#2a2622'; C.glove = '#2d2a26'; break;
    case 'raider': C.top = null; C.sleeve = null; C.pants = '#4a3a2c'; C.boot = '#2e241c'; C.belt = '#3a2a1c'; break;
    case 'power': C.pants = cdk(c1, 0.18); C.boot = cdk(c1, 0.3); C.glove = cdk(c1, 0.25); C.B = 1.24; break;
    case 'ninja': C.boot = '#141418'; C.glove = '#18181c'; C.belt = c2; break;

    case 'ranger': C.pants = '#2a2622'; C.boot = '#1d1916'; C.long = true; C.glove = '#231f1b'; break;
    case 'trench': C.pants = '#2e2a26'; C.boot = '#1a1614'; C.long = true; C.belt = cdk(c1, 0.3); break;
    case 'rags': C.sleeve = null; C.pants = '#4b4334'; C.boot = '#3b3226'; C.short = true; break;

}

// ---------- туловище ----------
function torsoGeo(P, C) {
  const f = P.female, B = C.B;
  const sw = (f ? 0.88 : 1) * B, ww = (f ? 0.82 : 0.96) * B, hw = (f ? 0.98 : 0.9) * B;
  const bust = f ? 0.9 : 0, belly = P.preg ? 2.6 : 0;
  const p = P2(p => {
    p.moveTo(-1.8 * B, -31.9);
    p.bezierCurveTo(-3.9 * sw, -32.0, -6.3 * sw, -31.3, -6.6 * sw, -28.7);
    p.bezierCurveTo(-6.9 * sw, -26.2, -5.3 * ww, -24.0, -4.9 * ww, -21.3);
    p.bezierCurveTo(-4.6 * ww, -19.5, -5.5 * hw, -18.0, -5.3 * hw, -15.9);
    p.bezierCurveTo(-5.1 * hw, -14.3, -3.4 * B, -13.5, 0.4, -13.5);
    p.bezierCurveTo(3.0 * B, -13.5, 5.1 * hw, -14.4, 5.3 * hw, -16.3);
    p.bezierCurveTo(5.5 * hw + belly * 0.6, -18.2, 4.4 * ww + belly, -19.2, 4.7 * ww + belly * 0.8, -21.4);
    p.bezierCurveTo(5.1 * sw + bust * 0.5, -23.0, 6.8 * sw + bust, -24.6, 6.6 * sw + bust * 0.4, -27.6);
    p.bezierCurveTo(6.4 * sw, -30.2, 4.9 * sw, -31.9, 2.6 * B, -31.9);
    p.closePath();
  });
  // линия середины груди (молния), вид 3/4
  const cx = y => y < -26 ? 2.1 + (-31.5 - y) * -0.16 + 1.0 : y < -20 ? 3.0 - (y + 26) * 0.1 : 2.4 - (y + 20) * 0.04;
  return { p, cx, sw, ww, hw, B,
    shN: [-3.7 * sw, -28.6], shF: [3.3 * sw, -29.3], hipN: [-1.8 * B, HIP_Y], hipF: [2.3 * B, HIP_Y - 0.2], neck: [0.6, -31.3] };
}
function coatTail(T, C) {
  const B = T.B;
  return P2(p => {
    p.moveTo(-5.2 * T.hw, -19);
    p.bezierCurveTo(-6.2 * T.hw, -14, -6.6 * B, -9, -6.4 * B, -5.8);
    p.lineTo(-0.2, -5.4);
    p.lineTo(1.6, -12.5);
    p.lineTo(3.4, -5.6);
    p.lineTo(5.9 * B, -6.2);

}

        seam(clt(L.c1, 0.2), q => { q.moveTo(-4.3, -27.4); q.lineTo(-1.3, -27.4); });

    }
    case 'jacket': {

      g.fillStyle = C.trim; g.beginPath(); g.moveTo(cx(-32) - 1.8, -32); g.lineTo(cx(-32) + 2.4, -32); g.lineTo(cx(-22) + 1.6, -20.6); g.lineTo(cx(-22) - 1.0, -20.6); g.closePath(); g.fill();

      g.fillStyle = cdk(L.c1, 0.3); g.fillRect(-9, -15.6, 18, 2.2);
      seam(clt(L.c1, 0.3), q => { q.moveTo(-5, -23); q.lineTo(-2.2, -23); }, 0.35);

// ===== Частицы и всплывающий текст =====
function drawFx(t) {
  const dt = 1 / 60;
  for (let i = R.tracers.length - 1; i >= 0; i--) {
    const tr = R.tracers[i];
    tr.t += dt;
    if (tr.t > 0.09) { R.tracers.splice(i, 1); continue; }
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(tr.col, 1 - tr.t / 0.09); ctx.lineWidth = tr.col === '#ffe08a' ? 0.8 : 1.6;
    ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  for (let i = R.parts.length - 1; i >= 0; i--) {
    const p = R.parts[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.heart ? -10 : p.smoke ? -5 : 160) * dt;
    if (p.t > p.life) { R.parts.splice(i, 1); continue; }
    const k = 1 - p.t / p.life;
    if (p.heart) { ctx.globalAlpha = k; ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s / 24, p.s / 24); ctx.fill(icoPath('heart')); ctx.restore(); }
    else if (p.smoke) { ctx.globalAlpha = k * 0.8; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1.6 - k * 0.6), 0, 7); ctx.fill(); }
    else { ctx.globalAlpha = k; ctx.globalCompositeOperation = p.ember ? 'lighter' : 'source-over'; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); ctx.globalCompositeOperation = 'source-over'; }
  }
  ctx.globalAlpha = 1;
  const s = 1 / clamp(Cam.z, 0.55, 1.4);
  for (let i = R.floaters.length - 1; i >= 0; i--) {
    const f = R.floaters[i];
    f.t += dt;
    if (f.t > 1.5) { R.floaters.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = f.t > 1.1 ? (1.5 - f.t) / 0.4 : Math.min(1, f.t * 6);
    const pop = f.t < 0.15 ? 0.7 + f.t * 2 : 1;
    ctx.translate(f.x, f.y - f.t * 28);
    ctx.scale(s * pop, s * pop);
    ctx.font = `700 15px ${FONT_D}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(f.text).width + (f.icon ? 18 : 0);
    ctx.translate(-tw / 2, 0);
    if (f.icon) { ctx.save(); ctx.translate(0, -8); ctx.scale(15 / 24, 15 / 24); ctx.fillStyle = f.col; ctx.strokeStyle = 'rgba(10,8,6,.85)'; ctx.lineWidth = 4; ctx.stroke(icoPath(f.icon)); ctx.fill(icoPath(f.icon)); ctx.restore(); }
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(10,8,6,.85)'; ctx.strokeText(f.text, f.icon ? 18 : 0, 0);
    ctx.fillStyle = f.col; ctx.fillText(f.text, f.icon ? 18 : 0, 0);
    ctx.restore();
  }
  if (R.flash > 0) R.flash = Math.max(0, R.flash - dt);
  if (R.doorHold > 0) R.doorHold -= dt;
}

// Портрет жителя для карточки
function drawPortrait(canvas, d) {
  // живой портрет: персонаж дышит и моргает, пока карточка открыта
  canvas._d = d;
  if (canvas._loop) return;
  canvas._loop = true;
  const tick = () => {
    if (!canvas.isConnected) { canvas._loop = false; return; }
    paintPortrait(canvas, canvas._d);
    requestAnimationFrame(tick);
  };
  tick();
}
function paintPortrait(canvas, d) {
  const g = canvas.getContext('2d');
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || 104, h = canvas.clientHeight || 128;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = performance.now() / 1000;
  // фон: стена убежища, прожектор сверху
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#26343a'); bg.addColorStop(0.72, '#18232a'); bg.addColorStop(0.73, '#2a2622'); bg.addColorStop(1, '#141210');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.05)'; for (let y = 14; y < h * 0.72; y += 18) g.fillRect(0, y, w, 1);
  g.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 15; y < h * 0.72; y += 18) g.fillRect(0, y, w, 1);
  g.globalCompositeOperation = 'lighter';
  const sp = g.createRadialGradient(w / 2, -10, 4, w / 2, h * 0.4, h * 0.75);
  sp.addColorStop(0, 'rgba(255,226,170,.42)'); sp.addColorStop(1, 'rgba(255,226,170,0)');
  g.fillStyle = sp; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'source-over';
  if (d.pet) { const T = PET_TYPES.find(p => p.id === d.pet.type); if (T && T.k !== 'bird') drawPet(g, d.pet, w * 0.2, h - 10, 1, false, t, 2.0); }
  const P = dwellerParams(d, w / 2 + 2, h - 9, t, 'idle', 2.25);
  P.face = 1;
  drawHuman(g, P);
  const vg = g.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}

// ===== Управление: перетаскивание, щипок, тап =====
const Ptr = { pts: new Map(), start: null, moved: false, pinch: null, vx: 0, vy: 0, lastT: 0, lastX: 0, lastY: 0, kin: false };

function initInput() {
  cv.addEventListener('pointerdown', e => {
    Snd.init();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    Ptr.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    Ptr.kin = false;
    if (Ptr.pts.size === 1) {
      Ptr.start = { x: e.clientX, y: e.clientY, cx: Cam.x, cy: Cam.y };
      Ptr.moved = false;
      Ptr.vx = Ptr.vy = 0;
      Ptr.lastT = performance.now(); Ptr.lastX = e.clientX; Ptr.lastY = e.clientY;
    } else if (Ptr.pts.size === 2) {
      const [a, b] = [...Ptr.pts.values()];
      Ptr.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: Cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      Ptr.moved = true;
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!Ptr.pts.has(e.pointerId)) return;
    Ptr.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!S) return;
    if (Ptr.pts.size === 1 && Ptr.start) {
      const dx = e.clientX - Ptr.start.x, dy = e.clientY - Ptr.start.y;
      if (!Ptr.moved && Math.hypot(dx, dy) > 9) Ptr.moved = true;
      if (Ptr.moved) {
        Cam.x = Ptr.start.cx - dx / Cam.z;
        Cam.y = Ptr.start.cy - dy / Cam.z;
        clampCam();
        const now = performance.now(), dtm = Math.max(1, now - Ptr.lastT);
        Ptr.vx = (e.clientX - Ptr.lastX) / dtm; Ptr.vy = (e.clientY - Ptr.lastY) / dtm;
        Ptr.lastT = now; Ptr.lastX = e.clientX; Ptr.lastY = e.clientY;
      }
    } else if (Ptr.pts.size === 2 && Ptr.pinch) {
      const [a, b] = [...Ptr.pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      zoomAt(mx, my, Ptr.pinch.z * (d / Math.max(10, Ptr.pinch.d)));
      Cam.x -= (mx - Ptr.pinch.mx) / Cam.z; Cam.y -= (my - Ptr.pinch.my) / Cam.z;
      Ptr.pinch.mx = mx; Ptr.pinch.my = my;
      clampCam();
    }
  });
  const up = e => {
    if (!Ptr.pts.has(e.pointerId)) return;
    const wasSingle = Ptr.pts.size === 1;
    Ptr.pts.delete(e.pointerId);
    if (Ptr.pts.size < 2) Ptr.pinch = null;
    if (Ptr.pts.size === 1) {
      const p = [...Ptr.pts.values()][0];
      Ptr.start = { x: p.x, y: p.y, cx: Cam.x, cy: Cam.y };
    }
    if (wasSingle && e.type === 'pointerup') {
      if (!Ptr.moved) onTap(e.clientX, e.clientY);
      else if (performance.now() - Ptr.lastT < 80) Ptr.kin = true;
    }
    if (!Ptr.pts.size) Ptr.start = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (!S) return;
    zoomAt(e.clientX, e.clientY, Cam.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!S || !R.playing || e.target.tagName === 'INPUT') return;
    const k = 40 / Cam.z;
    if (e.key === 'ArrowLeft') Cam.x -= k; else if (e.key === 'ArrowRight') Cam.x += k;
    else if (e.key === 'ArrowUp') Cam.y -= k; else if (e.key === 'ArrowDown') Cam.y += k;
    else if (e.key === '+' || e.key === '=') zoomAt(Cam.vw / 2, Cam.vh / 2, Cam.z * 1.15);
    else if (e.key === '-') zoomAt(Cam.vw / 2, Cam.vh / 2, Cam.z / 1.15);
    else if (e.key === 'Escape') { if (R.place) endPlace(); else UI.close(); }
    else return;
    clampCam();
  });
}
function kinetic(dt) {
  if (!Ptr.kin) return;
  Cam.x -= (Ptr.vx * 1000 * dt) / Cam.z;
  Cam.y -= (Ptr.vy * 1000 * dt) / Cam.z;
  const f = Math.pow(0.04, dt);
  Ptr.vx *= f; Ptr.vy *= f;
  clampCam();
  if (Math.hypot(Ptr.vx, Ptr.vy) < 0.02) Ptr.kin = false;
}

function onTap(sx, sy) {
  if (!S || !R.playing) return;
  const w = toWorld(sx, sy);
  if (R.place) {
    const sp = R.placeSpots.find(s => w.x >= s.c * CW && w.x <= (s.c + s.w) * CW && w.y >= roomY(s) && w.y <= roomY(s) + FH);
    if (sp) {
      const t = R.place;
      const r = buildRoom(t, sp.f, sp.c);
      endPlace();
      if (r && t !== 'elev') { R.selRoom = r.id; UI.open(roomView(r.id), true); revealAbove(roomX(r) + roomW(r) * CW / 2, roomY(r) + FH / 2); }
    } else toast('Нажмите на подсвеченное место', 'warn');
    return;
  }
  // таинственный незнакомец
  if (R.stranger) {
    const s = R.stranger, r = RM(s.room);
    if (r) { const sx0 = roomX(r) + s.x, sy0 = roomY(r) + FEET; if (Math.abs(w.x - sx0) < 14 && w.y > sy0 - 46 && w.y < sy0 + 6) { catchStranger(); return; } }
  }
  // пузыри ресурсов
  const bs = 1 / clamp(Cam.z, 0.55, 1.3);
  for (const r of S.rooms) {
    if (!r.rdy && !r.done) continue;
    const p = bubblePos(r);
    if (Math.hypot(w.x - p.x, w.y - p.y) < 20 * bs) { collectRoom(r); return; }
  }
  // улица: прибывшие и вернувшиеся
  const gy = GROUND_Y;
  if (w.x < PORTAL.x1 && w.y > gy - 70 && w.y < gy + 12) {
    let k = 0;
    for (const d of S.dwellers) {
      if (d.st !== 'explore' || !d.ex || !d.ex.home || d.leaving) continue;
      const x = PORTAL.x0 - 30 - (S.arrivals.length + k) * 22; k++;
      if (Math.abs(w.x - x) < 14) { collectExplorer(d); return; }
    }
    if (S.arrivals.length && w.x > PORTAL.x0 - 22 - S.arrivals.length * 22 - 14 && w.x < PORTAL.x1) { UI.open(arrivalsView(), true); return; }
  }
  // жители
  let best = null, bd = 1e9;
  const tol = 6 / Cam.z;
  for (const d of S.dwellers) {
    if (d.hide) continue;
    const p = dwellerWorldPos(d);
    if (!p) continue;
    const h = (d.child ? 30 : 44);
    if (w.x > p.x - 8 - tol && w.x < p.x + 8 + tol && w.y > p.y - h - tol && w.y < p.y + 4) {
      const dd = Math.abs(w.x - p.x);
      if (dd < bd) { bd = dd; best = d; }
    }
  }
  if (best) {
    if (best.st === 'dead') UI.open(deadView(best.id));
    else if (best.lu) levelUp(best);
    else { R.selD = best.id; UI.open(dwellerView(best.id)); const p = dwellerWorldPos(best); if (p) revealAbove(p.x, p.y - 16); }
    return;
  }
  // комнаты
  const f = Math.floor((w.y - SURF) / FH), c = Math.floor(w.x / CW);
  const r = at(f, c);
  if (r && r.t !== 'elev') {
    R.selRoom = r.id;
    UI.open(roomView(r.id), true);
    revealAbove(roomX(r) + roomW(r) * CW / 2, roomY(r) + FH / 2);
    return;
  }
  UI.close();
}

function startPlace(t) {
  if (!unlocked(t)) { toast(`Откроется при ${ROOMS[t].pop} жителях`, 'warn'); return; }
  if (t !== 'elev' && ROOMS[t].unique && hasType(t)) { toast('Такая комната уже построена', 'warn'); return; }
  if (S.res.caps < buildCost(t)) { toast('Не хватает крышек', 'bad'); Snd.bad(); return; }
  R.place = t;
  R.placeSpots = spotsFor(t);
  UI.close();
  if (!R.placeSpots.length) { toast('Нет доступных мест. Постройте лифт вниз', 'warn'); R.place = null; return; }
  const b = document.getElementById('place');
  b.hidden = false;
  b.querySelector('b').textContent = t === 'elev' ? 'Лифт' : ROOMS[t].n;
  b.querySelector('small').textContent = `${fmt(buildCost(t))} крышек · нажмите на подсвеченное место`;
  // показать ближайшее место
  const sp = R.placeSpots[0];
  const vis = R.placeSpots.some(s => { const x = s.c * CW, y = roomY(s); return x > Cam.x && x < Cam.x + Cam.vw / Cam.z && y > Cam.y && y < Cam.y + Cam.vh / Cam.z; });
  if (!vis) centerOn(sp.c * CW + sp.w * CW / 2, roomY(sp) + FH / 2);
}
function endPlace() {
  R.place = null;

}

// ===== Интерфейс (терминал смотрителя) =====
const $ = s => document.querySelector(s);
const UI = {
  stack: [], down: false, lastHtml: '',
  open(view, reset) {
    if (reset) this.stack = [];
    if (this.stack.length && this.stack[this.stack.length - 1].key === view.key) this.stack.pop();
    this.stack.push(view);
    this.show();
  },
  back() { this.stack.pop(); if (!this.stack.length) this.close(); else this.show(); },
  close() {
    this.stack = [];
    $('#sheet').hidden = true;
    R.selRoom = null; R.selD = null; R.sheetH = 0; R.renaming = null;
  },
  show() {
    const v = this.stack[this.stack.length - 1];
    if (!v) return this.close();
    const sh = $('#sheet');
    const was = sh.hidden;
    sh.hidden = false;
    if (was) { sh.style.animation = 'none'; void sh.offsetWidth; sh.style.animation = ''; }
    $('#sheet-back').hidden = this.stack.length < 2;
    $('#sheet-b').scrollTop = 0;
    this.lastHtml = '';
    this.render(true);
  },
  render(force) {
    const v = this.stack[this.stack.length - 1];
    if (!v) return;
    if (v.alive && !v.alive()) { this.back(); return; }
    const html = v.render();
    $('#sheet-t').textContent = typeof v.title === 'function' ? v.title() : v.title;
    if (!force && html === this.lastHtml) return;
    const b = $('#sheet-b');
    const st = b.scrollTop;
    b.innerHTML = html;
    b.scrollTop = st;
    this.lastHtml = html;
    if (v.after) v.after(b);
  },
  tick() {
    const v = this.stack[this.stack.length - 1];
    if (v && v.live && !this.down && !$('#sheet').hidden) this.render();
  },
};

function toast(msg, kind) {
  if (R.offline || !R.playing) return;
  const box = $('#toasts');
  const now = performance.now();
  if (R.lastToast === msg && now - (R.lastToastT || 0) < 2500) return;
  R.lastToast = msg; R.lastToastT = now;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 2800);
}
